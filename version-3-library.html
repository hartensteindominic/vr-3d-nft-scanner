<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream // Library 03</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#010208;color:#fff;font-family:system-ui}#space{position:fixed;inset:0}.ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:18px;pointer-events:auto}.brand{font-weight:1000;letter-spacing:3px}.brand b{color:#72f5ff}.nav button{margin-left:6px;border:1px solid #ffffff20;background:#070b14dd;color:#fff;border-radius:13px;padding:10px 13px;font-weight:900}.title{position:absolute;left:5vw;top:17vh;max-width:430px}.ey{font-size:10px;letter-spacing:4px;color:#72f5ff;font-weight:900}.title h1{font-size:clamp(55px,8vw,100px);line-height:.82;letter-spacing:-6px;margin:12px 0}.title p{color:#9ba4b9;line-height:1.6}.dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(900px,92vw);padding:15px;border:1px solid #ffffff18;border-radius:24px;background:#050810df;backdrop-filter:blur(24px);pointer-events:auto}.docktop{display:flex;justify-content:space-between;align-items:center}.docktop h2{margin:3px 0;font-size:18px}.rail{display:flex;gap:9px;overflow:auto;margin-top:10px}.card{min-width:125px;height:100px;border:1px solid #ffffff15;border-radius:16px;background:radial-gradient(circle,#25204c,#070a11);display:flex;align-items:center;justify-content:center;cursor:pointer}.shape{width:48px;height:48px;background:var(--c);border-radius:35%;box-shadow:0 0 40px var(--c);transform:rotate(35deg)}.trade{display:flex;gap:7px}.trade button{border:0;border-radius:10px;padding:10px 13px;font-weight:950}.buy{background:#fff}.offer{background:#121827;color:#fff;border:1px solid #ffffff18!important}@media(max-width:650px){.nav{display:none}.title{left:20px;top:13vh}.title h1{font-size:58px}.dock{bottom:12px}.card{min-width:105px;height:82px}}</style></head><body><div id="space"></div><div class="ui"><header class="top"><div class="brand"><b>◆</b> HYPERSTREAM / 03</div><div class="nav"><button>LIBRARY</button><button>CREATE</button><button>VAULT</button><button>WALLET</button></div></header><section class="title"><div class="ey">THE ARCHIVE IS ALIVE</div><h1>EXPLORE<br>THE<br>LIBRARY.</h1><p>A deep-space archive built around the objects themselves. Move through layers of collectible geometry, focus an artifact and trade it without leaving the 3D world.</p></section><section class="dock"><div class="docktop"><div><div class="ey">SELECTED OBJECT</div><h2 id="name">NEON RELIC · 0.42 ETH</h2></div><div class="trade"><button class="buy">BUY</button><button class="offer">OFFER</button></div></div><div class="rail" id="rail"></div></section></div><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const s=new THREE.Scene();s.fog=new THREE.FogExp2(0x010208,.019);const c=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,400);c.position.set(0,5,20);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#space').appendChild(r.domElement);const o=new OrbitControls(c,r.domElement);o.enableDamping=1;o.enablePan=0;o.maxDistance=38;s.add(new THREE.AmbientLight(0x778cff,1.4));let cols=[0x62efff,0x9d6cff,0xff5fd6,0x6effb0,0xffc857,0x779bff],names=['NEON RELIC','VOID BLOOM','CHROMA CORE','QUANTUM MASK','SOLAR SHARD','DREAM ENGINE','AETHER NODE','GHOST FORM','PRISM HEART','STAR FORGE','DEEP BLOOM','NOVA KEY'];let objs=[];for(let i=0;i<24;i++){let g=new THREE.Group(),co=cols[i%6],m=new THREE.MeshStandardMaterial({color:co,emissive:co,emissiveIntensity:.5,metalness:.75,roughness:.18}),q=i%2?new THREE.IcosahedronGeometry(1.1,2):new THREE.TorusKnotGeometry(.82,.23,64,12);g.add(new THREE.Mesh(q,m));let ring=new THREE.Mesh(new THREE.TorusGeometry(1.65,.018,8,72),new THREE.MeshBasicMaterial({color:co,transparent:true,opacity:.55}));ring.rotation.x=1.15;g.add(ring);let row=Math.floor(i/6);g.position.set((i%6-2.5)*4,(i%3)*2.7-2.8,-row*8);g.userData={name:names[i%names.length],price:(.15+i*.027).toFixed(2)};s.add(g);objs.push(g)}let grid=new THREE.GridHelper(180,90,0x24324c,0x0b1424);grid.position.y=-4;s.add(grid);let t=0;function loop(){requestAnimationFrame(loop);t+=.006;objs.forEach((g,i)=>{g.rotation.y+=.005;g.rotation.x+=.001;g.position.y+=Math.sin(t*2+i)*.002});o.update();r.render(s,c)}loop();const rail=document.querySelector('#rail');objs.slice(0,10).forEach((g,i)=>{let x=document.createElement('div');x.className='card';x.innerHTML='<div class="shape" style="--c:#'+cols[i%6].toString(16).padStart(6,'0')+'"></div>';x.onclick=()=>{document.querySelector('#name').textContent=g.userData.name+' · '+g.userData.price+' ETH';c.position.set(g.position.x,g.position.y+2,g.position.z+8)};rail.appendChild(x)});addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
