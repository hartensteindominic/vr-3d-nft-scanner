<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040a"><title>HyperStream 3D Object</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#123a52,#050913 42%,#02040a 85%);color:#eaffff;font:15px system-ui;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.16;background:linear-gradient(rgba(95,246,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(95,246,255,.14) 1px,transparent 1px);background-size:44px 44px}.wrap{position:relative;z-index:1;max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#668b9e;font-size:10px;letter-spacing:2px}.brand{color:#5ff6ff;font-weight:950;letter-spacing:5px}.hero{margin-top:18px;padding:22px;border:1px solid #5ff6ff33;border-radius:30px;background:linear-gradient(145deg,#091b2be8,#030811ee);box-shadow:0 30px 100px #0008,inset 0 0 70px #5ff6ff08}.tag{font-size:10px;letter-spacing:4px;color:#72ffbd;font-weight:900}.title{font-size:clamp(34px,6vw,68px);line-height:.92;letter-spacing:-3px;margin:10px 0;text-transform:uppercase}.meta{color:#87a8b9}.viewer{margin-top:18px;height:min(67vh,650px);min-height:390px;border-radius:24px;overflow:hidden;border:1px solid #5ff6ff22;background:radial-gradient(circle,#0b2030,#02050a)}model-viewer{width:100%;height:100%;--poster-color:transparent}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{padding:13px;border:1px solid #5ff6ff18;border-radius:16px;background:#030a12}.stat span{display:block;font-size:9px;color:#5d7c8c;letter-spacing:1px}.stat b{display:block;margin-top:5px;font-family:monospace;word-break:break-all}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;padding:14px 18px;border-radius:15px;border:1px solid #5ff6ff44;background:linear-gradient(90deg,#5ff6ff,#8d7cff);color:#020812;font-weight:950;text-decoration:none;cursor:pointer}.btn.alt{background:#071522;color:#a9eaf4}.err{color:#ff8999;padding:20px}@media(max-width:650px){.stats{grid-template-columns:1fr}.viewer{min-height:330px}.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div class="brand">HYPERSTREAM</div><div>PUBLIC 3D OBJECT // NO WALLET REQUIRED</div></div><section class="hero"><div class="tag">SPATIAL COLLECTIBLE</div><div class="title" id="name">Loading object…</div><div class="meta" id="desc">Interactive 3D NFT</div><div class="viewer"><model-viewer id="model" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral"></model-viewer></div><div class="stats"><div class="stat"><span>NETWORK</span><b>SEPOLIA</b></div><div class="stat"><span>TOKEN</span><b id="token">—</b></div><div class="stat"><span>CREATED BY</span><b id="creator">HYPERSTREAM</b></div></div><div class="actions"><a class="btn" href="./index.html">CREATE YOUR OWN 3D NFT</a><a class="btn alt" id="tx" target="_blank" rel="noopener">VIEW ON SEPOLIA</a><button class="btn alt" id="share">SHARE OBJECT</button></div><div id="error"></div></section></div><script>const q=new URLSearchParams(location.search),meta=q.get('metadata'),name=q.get('name')||'HYPERSTREAM OBJECT',token=q.get('token')||'—',tx=q.get('tx');document.title=name+' · HyperStream';document.getElementById('name').textContent=name;document.getElementById('token').textContent=token;if(tx)document.getElementById('tx').href='https://sepolia.etherscan.io/tx/'+tx;else document.getElementById('tx').style.display='none';document.getElementById('share').onclick=()=>navigator.share?navigator.share({title:name,text:'Explore my HyperStream 3D NFT',url:location.href}):navigator.clipboard?.writeText(location.href).then(()=>document.getElementById('share').textContent='COPIED ✓');async function load(){if(!meta){document.getElementById('error').innerHTML='<div class="err">No 3D object was supplied.</div>';return}try{const uri=meta.replace(/^ipfs:\/\//,'https://ipfs.io/ipfs/');const r=await fetch(uri);if(!r.ok)throw Error('Metadata unavailable');const d=await r.json();document.getElementById('desc').textContent=d.description||'Interactive 3D NFT';const model=d.animation_url||d.image;if(!model)throw Error('No 3D asset in metadata');document.getElementById('model').src=model.replace(/^ipfs:\/\//,'https://ipfs.io/ipfs/')}catch(e){document.getElementById('error').innerHTML='<div class="err">3D metadata could not be loaded yet. Try again in a moment.</div>'}}load()</script></body></html>
