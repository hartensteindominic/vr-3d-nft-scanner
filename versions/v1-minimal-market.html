<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream V1</title><style>body{margin:0;background:#050711;color:white;font:16px system-ui;padding:32px}h1{color:#61f6ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#10162a;border:1px solid #29405f;border-radius:18px;padding:16px}.orb{height:170px;display:grid;place-items:center;perspective:500px}.cube{width:80px;height:80px;background:linear-gradient(135deg,#61f6ff,#785cff);transform:rotateX(55deg) rotateZ(45deg);box-shadow:0 0 45px #61f6ff88}.price{font-weight:800;color:#61f6ff}button{border:0;border-radius:10px;padding:10px 14px;background:#785cff;color:#fff;font-weight:700}</style><h1>HYPERSTREAM // V1</h1><p>Minimal 3D NFT marketplace demo</p><div class="grid">AETHER BLOOM|0.42 MATIC|SCULPTURE;QUANTUM HABITAT|1.80 MATIC|WORLD;PRISM RUNNER|0.73 MATIC|AVATAR;VOID RELIC|2.40 MATIC|ARTIFACT;MOON ARCHIVE|0.96 MATIC|WORLD;CHROMATIC GHOST|0.58 MATIC|AVATAR</div><script>document.querySelector('.grid').innerHTML=document.querySelector('.grid').textContent.split(';').map(x=>{let[a,b,c]=x.split('|');return `<article class="card"><div class="orb"><div class="cube"></div></div><h2>${a}</h2><p>${c}</p><p class="price">${b}</p><button>VIEW 3D</button></article>`}).join('')</script>
