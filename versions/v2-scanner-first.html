<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream V2 Scanner</title><style>body{margin:0;background:#02070a;color:#dffcff;font:15px system-ui;padding:24px}.shell{max-width:1100px;margin:auto}.stage{height:55vh;border:1px solid #25e6ff55;border-radius:24px;background:radial-gradient(circle,#12343d,#02070a 65%);display:grid;place-items:center;perspective:700px}.scan{width:190px;height:190px;border:2px solid #42f6ff;border-radius:28px;transform:rotateX(58deg) rotateZ(45deg);box-shadow:0 0 80px #42f6ff66;animation:spin 7s linear infinite}@keyframes spin{to{transform:rotateX(58deg) rotateZ(405deg)}}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.pill{padding:10px 14px;border:1px solid #24515c;border-radius:999px}.ok{color:#65ffbf}button{padding:12px 18px;border:0;border-radius:12px;background:#26dce9;font-weight:800}</style><div class="shell"><h1>HYPERSTREAM // V2</h1><p>Scanner-first concept · RGB capture → estimated depth → 3D preview</p><section class="stage"><div class="scan"></div></section><div class="row"><span class="pill ok">CAMERA READY</span><span class="pill">RGB MONOCULAR</span><span class="pill">DEPTH ESTIMATED</span><span class="pill">GLB OUTPUT</span><button>START SCAN</button></div></div>
