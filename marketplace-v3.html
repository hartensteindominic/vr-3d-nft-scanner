<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream 3D NFT Studio</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script><script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script><style>body{margin:0;background:#05060b;color:#fff;font:15px system-ui}main{max-width:980px;margin:auto;padding:18px}.panel{background:#0b101b;border:1px solid #263047;border-radius:20px;padding:20px;margin:14px 0}.cyan{color:#64f6ff}.btn{padding:15px 18px;border:0;border-radius:12px;background:#64f6ff;color:#031016;font-weight:900;margin:4px;cursor:pointer}.btn:disabled{opacity:.55}.upload{border:2px dashed #64f6ff55;padding:25px;text-align:center;border-radius:16px}.upload input{display:none}.upload label{display:inline-block;padding:14px;background:#10202a;border-radius:12px;color:#bfffff;font-weight:900}.preview{height:380px;background:#05070c;border-radius:16px;overflow:hidden;margin:14px 0}.preview model-viewer{width:100%;height:100%}.meter{height:8px;background:#182235;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#64f6ff}.status{white-space:pre-wrap;margin-top:12px;color:#71f7b0}.error{color:#ff8b8b}input[type=text]{width:100%;padding:13px;background:#080c14;color:white;border:1px solid #263047;border-radius:10px}.walletbox{text-align:center;padding:18px;border:1px solid #263047;border-radius:16px;background:#080c14}.walletaddr{color:#71f7b0;font-weight:800}.walletstatus{min-height:22px;margin-top:10px;color:#9bb0c9}</style><script type="module" src="./reown-wallet.js?v=20260818-6"></script></head><body><main><section class="panel"><div class="cyan">HYPERSTREAM 3D · QUEST MODE</div><h1>Large 3D files → NFTs.</h1><p>GLB uploads up to 250 MB.</p><div class="walletbox"><h2>🦊 CONNECT WALLET</h2><p>Quest-first wallet connection. No QR scanner required.</p><button class="btn" id="connectWalletBtn" type="button">🦊 CONNECT WALLET</button><div id="wallet" class="walletaddr"></div><div id="walletStatus" class="walletstatus">Ready</div></div></section><section class="panel"><div class="upload"><label for="asset">SELECT GLB / GLTF / USDZ</label><input id="asset" type="file" accept=".glb,.gltf,.usdz,model/gltf-binary,model/gltf+json"><p id="fileStatus">Up to 250 MB · GLB recommended</p></div><div class="meter"><i id="meter"></i></div><div class="preview"><model-viewer id="preview" camera-controls auto-rotate></model-viewer></div><input id="name" type="text" value="My HyperObject" placeholder="NFT name"><br><br><button class="btn" id="uploadBtn">UPLOAD TO IPFS ONLY</button><button class="btn" id="mintBtn">UPLOAD + MINT 3D NFT</button><div id="status" class="status"></div></section><section class="panel">📦 250 MB · ☁️ IPFS · ⛓️ Sepolia · 🥽 Quest 3<br><small>Contract: 0x6ebd920e2383e11a06440ed632c51225b5f1909b</small></section></main><script>const API='https://vr-3d-nft-scanner.vercel.app';const CONTRACT='0x6ebd920e2383e11a06440ed632c51225b5f1909b',OWNER='0x02f93c7547309ca50EEAB446DaEBE8ce8E694cBb',MAX=250*1024*1024,ABI=['function mint(address to,string metadataURI) external returns(uint256)'];let cached=null,obj='';const $=id=>document.getElementById(id),asset=$('asset'),status=$('status'),meter=$('meter'),preview=$('preview');function msg(t,e=false){status.textContent=t;status.className='status'+(e?' error':'')}asset.onchange=()=>{cached=null;const f=asset.files[0];if(!f)return;if(f.size>MAX){msg('File exceeds 250 MB.',true);asset.value='';return}if(obj)URL.revokeObjectURL(obj);obj=URL.createObjectURL(f);preview.src=obj;$('fileStatus').textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' MB';meter.style.width=Math.min(100,f.size/MAX*100)+'%';msg('3D file loaded locally ✓')};window.hyperstreamSetWallet=function(address){if(address){$('wallet').textContent='🦊 Connected: '+address.slice(0,8)+'…'+address.slice(-6);$('walletStatus').textContent='Connected ✓';msg('🦊 Wallet connected ✓')}};window.hyperstreamWalletStatus=function(t,e=false){$('walletStatus').textContent=t;if(e)$('walletStatus').className='walletstatus error'};window.addEventListener('error',e=>{if($('walletStatus'))$('walletStatus').textContent='Wallet script error: '+(e.message||'unknown')});async function getSign(f){const r=await fetch(API+'/api/sign-upload?filename='+encodeURIComponent(f.name));const t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error('Vercel upload API returned '+r.status)}if(!r.ok||!d.url)throw Error(d.error||'Signing failed');return d.url}function send(f,url){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST',url);x.timeout=1800000;x.upload.onprogress=e=>{if(e.lengthComputable){meter.style.width=(e.loaded/e.total*100)+'%';msg('Uploading GLB to IPFS… '+(e.loaded/e.total*100).toFixed(0)+'%')}};x.onload=()=>{let d={};try{d=JSON.parse(x.responseText||'{}')}catch{}if(x.status<200||x.status>=300)return no(Error(d.error||d.message||'Pinata upload failed HTTP '+x.status));const cid=d?.data?.cid||d?.cid;if(!cid)return no(Error('Upload completed but Pinata returned no CID'));ok(cid)};x.onerror=()=>no(Error('Network error during upload'));x.ontimeout=()=>no(Error('Upload timed out'));const fd=new FormData();fd.append('network','public');fd.append('file',f,f.name);x.send(fd)})}async function upload(){const f=asset.files[0];if(!f)return msg('Select your GLB first.',true),null;if(cached&&cached.size===f.size&&cached.name===f.name)return cached;try{msg('Creating secure upload…');const cid=await send(f,await getSign(f));msg('Creating NFT metadata…');const r=await fetch(API+'/api/metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({metadata:{name:$('name').value||'HyperStream 3D',description:'HyperStream 3D NFT',animation_url:'ipfs://'+cid,attributes:[{trait_type:'Format',value:'GLB'}]}})});const d=await r.json();if(!r.ok)throw Error(d.error||'Metadata failed');cached={cid,metadataUri:d.metadataUri,size:f.size,name:f.name};msg('☁️ IPFS upload complete ✓\n'+cached.metadataUri);return cached}catch(e){msg('UPLOAD FAILED\n'+e.message,true);return null}}$('uploadBtn').onclick=async()=>{$('uploadBtn').disabled=true;try{await upload()}finally{$('uploadBtn').disabled=false}};$('mintBtn').onclick=async()=>{try{$('mintBtn').disabled=true;const u=await upload();if(!u)return;const p=window.walletProvider;if(!p)throw Error('Connect your wallet first.');const provider=new ethers.BrowserProvider(p);if((await provider.getNetwork()).chainId!==11155111n)throw Error('Switch MetaMask to Sepolia, then try Mint again.');const s=await provider.getSigner(),a=await s.getAddress();if(a.toLowerCase()!==OWNER.toLowerCase())throw Error('Connect the owner wallet:\n'+OWNER);const c=new ethers.Contract(CONTRACT,ABI,s);const tx=await c.mint(a,u.metadataUri);msg('Transaction sent…\n'+tx.hash);await tx.wait();msg('🎉 3D NFT MINTED!\n'+tx.hash)}catch(e){msg('MINT FAILED\n'+(e.shortMessage||e.reason||e.message),true)}finally{$('mintBtn').disabled=false}};</script></body></html>
