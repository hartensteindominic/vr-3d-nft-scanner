<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D NFT Creator | VR Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            color: white; 
        }

        #canvas { display: block; width: 100%; height: 100vh; }

        #ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .logo { 
            font-size: 28px; 
            font-weight: 700; 
            letter-spacing: 4px; 
            background: linear-gradient(135deg, #c9a227, #e0b83a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            pointer-events: auto;
            background: #c9a227;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        button:hover { 
            background: #e0b83a;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(201,162,39,0.3);
        }

        button:active { transform: translateY(0); }

        .sidebar {
            pointer-events: auto;
            position: absolute;
            left: 30px;
            top: 120px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(201,162,39,0.3);
            max-width: 320px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .sidebar h3 {
            margin-bottom: 16px;
            color: #c9a227;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .info-box {
            pointer-events: auto;
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-left: 4px solid #c9a227;
            border-radius: 8px;
            max-width: 380px;
            font-size: 13px;
            line-height: 1.6;
        }

        .info-box h4 {
            color: #c9a227;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .status {
            pointer-events: auto;
            position: absolute;
            top: 80px;
            right: 30px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.3);
            font-size: 12px;
            max-width: 300px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(201,162,39,0.1);
        }

        .status-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .status-label { color: #aaa; }
        .status-value { color: #c9a227; font-weight: 600; }

        .export-section {
            pointer-events: auto;
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(201,162,39,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .top-bar { padding: 16px 20px; }
            .sidebar { left: 15px; right: 15px; max-width: none; }
            .info-box { left: 15px; right: 15px; max-width: none; }
            .export-section { right: 15px; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="top-bar">
            <div class="logo">NFTVERSE</div>
            <div class="controls">
                <button id="resetBtn">Reset</button>
                <button id="vrBtn">VR Mode</button>
            </div>
        </div>

        <div class="sidebar">
            <h3>3D Creator</h3>
            
            <div class="control-group">
                <label>Shape Type</label>
                <select id="shapeSelect" style="width: 100%; padding: 8px; background: #1a1a2e; color: #c9a227; border: 1px solid #c9a227; border-radius: 4px; cursor: pointer;">
                    <option value="cube">Cube</option>
                    <option value="sphere">Sphere</option>
                    <option value="torus">Torus</option>
                    <option value="pyramid">Pyramid</option>
                </select>
            </div>

            <div class="control-group">
                <label>Scale</label>
                <input type="range" id="scaleSlider" min="0.5" max="3" step="0.1" value="1" style="cursor: pointer;">
            </div>

            <div class="control-group">
                <label>Rotation Speed</label>
                <input type="range" id="rotationSlider" min="0" max="5" step="0.1" value="2" style="cursor: pointer;">
            </div>

            <div class="control-group">
                <label>Color</label>
                <input type="color" id="colorPicker" value="#c9a227">
            </div>

            <div class="control-group">
                <label>Metalness</label>
                <input type="range" id="metalnessSlider" min="0" max="1" step="0.1" value="0.8" style="cursor: pointer;">
            </div>

            <div class="control-group">
                <label>Roughness</label>
                <input type="range" id="roughnessSlider" min="0" max="1" step="0.1" value="0.2" style="cursor: pointer;">
            </div>
        </div>

        <div class="status">
            <div class="status-item">
                <span class="status-label">FPS:</span>
                <span class="status-value" id="fps">60</span>
            </div>
            <div class="status-item">
                <span class="status-label">Objects:</span>
                <span class="status-value" id="objectCount">1</span>
            </div>
            <div class="status-item">
                <span class="status-label">Mode:</span>
                <span class="status-value" id="modeDisplay">Desktop</span>
            </div>
        </div>

        <div class="info-box">
            <h4>✨ Welcome to 3D NFT Creator</h4>
            <p>Customize the 3D object using the controls on the left. Click and drag to rotate. Use your mouse wheel to zoom. Export as NFT when ready!</p>
        </div>

        <div class="export-section">
            <button id="screenshotBtn" style="padding: 12px 20px; font-size: 12px;">📸 Screenshot</button>
            <button id="exportBtn" style="padding: 12px 20px; font-size: 12px;">💾 Export NFT Data</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@r128/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@r128/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, controls, mainObject;
        let currentShape = 'cube';
        let stats = { fps: 0, frameCount: 0, lastTime: performance.now() };

        // Initialize
        init();
        animate();

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 100, 1000);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 2, 5);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 15, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xc9a227, 0.5);
            pointLight.position.set(-5, 3, 5);
            scene.add(pointLight);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x0f0f1e, 
                roughness: 0.8,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Grid helper
            const gridHelper = new THREE.GridHelper(40, 40, 0x333333, 0x111111);
            scene.add(gridHelper);

            // Create initial object
            createShape('cube');

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.xr.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // VR Button
            document.getElementById('vrBtn').addEventListener('click', () => {
                if (renderer.xr.isPresenting) {
                    renderer.xr.getSession().end();
                } else {
                    document.body.appendChild(VRButton.createButton(renderer));
                }
            });

            // UI Controls
            document.getElementById('shapeSelect').addEventListener('change', (e) => {
                createShape(e.target.value);
            });

            document.getElementById('scaleSlider').addEventListener('input', (e) => {
                mainObject.scale.set(e.target.value, e.target.value, e.target.value);
            });

            document.getElementById('rotationSlider').addEventListener('input', (e) => {
                controls.autoRotateSpeed = parseFloat(e.target.value);
            });

            document.getElementById('colorPicker').addEventListener('input', (e) => {
                mainObject.material.color.set(e.target.value);
            });

            document.getElementById('metalnessSlider').addEventListener('input', (e) => {
                mainObject.material.metalness = parseFloat(e.target.value);
            });

            document.getElementById('roughnessSlider').addEventListener('input', (e) => {
                mainObject.material.roughness = parseFloat(e.target.value);
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                camera.position.set(0, 2, 5);
                controls.reset();
                document.getElementById('scaleSlider').value = 1;
                document.getElementById('rotationSlider').value = 2;
                document.getElementById('colorPicker').value = '#c9a227';
                mainObject.scale.set(1, 1, 1);
                mainObject.material.color.set(0xc9a227);
                mainObject.material.metalness = 0.8;
                mainObject.material.roughness = 0.2;
            });

            document.getElementById('screenshotBtn').addEventListener('click', takeScreenshot);
            document.getElementById('exportBtn').addEventListener('click', exportNFTData);

            window.addEventListener('resize', onWindowResize);
        }

        function createShape(type) {
            if (mainObject) scene.remove(mainObject);

            currentShape = type;
            let geometry;

            switch(type) {
                case 'sphere':
                    geometry = new THREE.IcosahedronGeometry(1.5, 32);
                    break;
                case 'torus':
                    geometry = new THREE.TorusKnotGeometry(1, 0.4, 128, 32);
                    break;
                case 'pyramid':
                    geometry = new THREE.ConeGeometry(1.5, 3, 4);
                    break;
                default:
                    geometry = new THREE.BoxGeometry(2, 2, 2);
            }

            const material = new THREE.MeshStandardMaterial({
                color: 0xc9a227,
                metalness: 0.8,
                roughness: 0.2,
                envMapIntensity: 1
            });

            mainObject = new THREE.Mesh(geometry, material);
            mainObject.castShadow = true;
            mainObject.receiveShadow = true;
            scene.add(mainObject);

            document.getElementById('objectCount').textContent = scene.children.length;
        }

        function takeScreenshot() {
            const link = document.createElement('a');
            link.href = renderer.domElement.toDataURL('image/png');
            link.download = `nft-${Date.now()}.png`;
            link.click();
        }

        function exportNFTData() {
            const nftData = {
                name: `NFT-${Date.now()}`,
                type: currentShape,
                properties: {
                    scale: mainObject.scale.x,
                    color: mainObject.material.color.getHexString(),
                    metalness: mainObject.material.metalness,
                    roughness: mainObject.material.roughness,
                    rotation: {
                        x: mainObject.rotation.x,
                        y: mainObject.rotation.y,
                        z: mainObject.rotation.z
                    }
                },
                timestamp: new Date().toISOString(),
                exportedFrom: 'NFTVERSE 3D Creator'
            };

            const dataStr = JSON.stringify(nftData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `${nftData.name}.json`;
            link.click();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateFPS() {
            stats.frameCount++;
            const now = performance.now();
            if (now >= stats.lastTime + 1000) {
                stats.fps = stats.frameCount;
                document.getElementById('fps').textContent = stats.fps;
                stats.frameCount = 0;
                stats.lastTime = now;
            }
        }

        function animate() {
            renderer.setAnimationLoop(() => {
                updateFPS();
                controls.update();
                renderer.render(scene, camera);
                document.getElementById('modeDisplay').textContent = renderer.xr.isPresenting ? 'VR' : 'Desktop';
            });
        }
    </script>
</body>
</html>
