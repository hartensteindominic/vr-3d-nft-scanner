<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR 3D NFT Scanner – Hologram Gallery</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/",
      "ethers": "https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <!-- Immersive full-screen viewport -->
  <div id="viewport-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <p>Loading hologram gallery...</p>
    </div>
  </div>

  <!-- Elegant floating top bar -->
  <header id="top-bar">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <div>
        <h1>VR 3D NFT Scanner</h1>
        <p class="tagline">Scan → Hologram → NFT</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="btn-connect" class="btn btn-primary">Connect Wallet</button>
      <div id="wallet-info" class="wallet-info hidden">
        <span id="wallet-address">0x...</span>
        <span id="network-badge">Amoy</span>
      </div>
    </div>
  </header>

  <!-- Left floating panel – Scan / Upload -->
  <aside id="left-panel" class="floating-panel">
    <div class="panel-header">
      <h2>Capture</h2>
      <button class="panel-toggle" data-panel="left">−</button>
    </div>
    <div class="panel-body">
      <div class="scan-modes">
        <button class="mode-btn active" data-mode="guided">Guided</button>
        <button class="mode-btn" data-mode="upload">Upload</button>
      </div>

      <div id="guided-scan" class="mode-content">
        <ol class="steps">
          <li>Place object in good light</li>
          <li>Circle slowly 2–3 times (Polycam / Scaniverse)</li>
          <li>Export as <strong>GLB</strong></li>
        </ol>
        <button id="btn-start-scan-guide" class="btn btn-secondary full">Start Guide</button>
      </div>

      <div id="upload-mode" class="mode-content hidden">
        <div id="drop-zone" class="drop-zone">
          <div class="drop-icon">⬆</div>
          <p>Drop <strong>.glb</strong> here</p>
          <input type="file" id="file-input" accept=".glb,.gltf" hidden />
        </div>
        <div id="upload-status" class="status-box hidden"></div>
      </div>

      <div id="current-model-info" class="model-info">
        <p class="empty">No model loaded</p>
      </div>
      <button id="btn-clear-model" class="btn btn-ghost full hidden">Clear Model</button>
    </div>
  </aside>

  <!-- Right floating panel – Mint + Collection -->
  <aside id="right-panel" class="floating-panel">
    <div class="panel-header">
      <h2>Mint NFT</h2>
      <button class="panel-toggle" data-panel="right">−</button>
    </div>
    <div class="panel-body">
      <label>Name
        <input type="text" id="nft-name" placeholder="My Hologram" maxlength="64" />
      </label>
      <label>Description
        <textarea id="nft-desc" placeholder="Scanned from real life..." rows="2"></textarea>
      </label>

      <div class="mint-actions">
        <button id="btn-prepare-mint" class="btn btn-secondary full" disabled>Upload to IPFS</button>
        <button id="btn-mint" class="btn btn-primary full" disabled>Mint NFT</button>
      </div>
      <div id="mint-status" class="status-box hidden"></div>

      <div class="divider"></div>

      <h3>My Collection</h3>
      <div id="collection-list" class="collection-list">
        <p class="empty">Connect wallet to view</p>
      </div>
    </div>
  </aside>

  <!-- Bottom center controls -->
  <div id="bottom-bar">
    <div class="stats">
      <span id="objects-count">1 Hologram</span>
    </div>
    <button id="btn-enter-vr" class="btn btn-vr">Enter VR</button>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
