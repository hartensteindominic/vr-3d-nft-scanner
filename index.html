<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050a"><title>HyperStream HGLM 2.0</title><style>:root{--c:#61f6ff;--v:#8d70ff;--bg:#02050a;--muted:#78909b}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#eaffff;font:14px system-ui}canvas{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between}.brand{font-weight:900;letter-spacing:.2em}.brand span{color:var(--c)}.pill{padding:8px 12px;border:1px solid #61f6ff38;border-radius:99px;background:#061019dd;color:#a8f7fa;font-size:10px;letter-spacing:.12em}.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}.eyebrow{font-size:10px;letter-spacing:.3em;color:#79929d}.stage h1{margin:8px 0;font-size:clamp(34px,7vw,78px);font-weight:300;letter-spacing:.14em}.stage p{color:var(--muted)}.scanline{position:absolute;left:12%;right:12%;height:1px;top:50%;background:#61f6ff55;box-shadow:0 0 20px #61f6ff;animation:sweep 4s linear infinite}@keyframes sweep{0%{top:20%}50%{top:80%}100%{top:20%}}.readouts{position:absolute;left:20px;bottom:24px;width:190px}.readout{margin-top:7px;padding:10px 12px;border-left:2px solid var(--c);background:#061019aa}.readout small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em}.readout b{font-size:17px}.drawer{position:absolute;right:20px;bottom:24px;width:240px;padding:14px;border:1px solid #61f6ff38;border-radius:15px;background:#071019dd;backdrop-filter:blur(16px)}.drawer h3{margin:0 0 10px;font-size:10px;letter-spacing:.18em}.bar{height:5px;background:#10202a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--v));transition:width .2s}.note{margin-top:9px;color:var(--muted);font-size:10px;line-height:1.5}.buttons{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.btn{border:1px solid #61f6ff55;border-radius:11px;padding:13px 16px;background:#07141ddd;color:#eaffff;font-weight:800;letter-spacing:.08em;cursor:pointer}.primary{background:var(--c);color:#011016;border-color:var(--c)}button:disabled{opacity:.4;cursor:not-allowed}@media(max-width:700px){.readouts{display:none}.drawer{left:12px;right:12px;width:auto;bottom:78px}.buttons{left:12px;right:12px;transform:none}.btn{flex:1;padding:13px 7px}.stage h1{font-size:34px}}</style></head><body><div id="root"></div><div class="hud"><div class="top"><div class="brand"><span>HYPER</span>STREAM / HGLM</div><div class="pill" id="engine">GPU INITIALIZING</div></div><div class="top" style="top:60px;justify-content:flex-end"><div class="pill" id="xr">XR CHECKING</div></div><div class="stage"><div class="eyebrow" id="state">SPATIAL CAPTURE ENGINE</div><h1>HOLOGRAM</h1><p id="sub">RGB → ESTIMATED DEPTH → VOLUME</p></div><div class="scanline"></div><div class="readouts"><div class="readout"><small>VOXEL FIELD</small><b id="vox">18,420</b></div><div class="readout"><small>DEPTH CONFIDENCE</small><b id="conf">--%</b></div><div class="readout"><small>RECONSTRUCTION</small><b id="recon">READY</b></div></div><div class="drawer"><h3>RECONSTRUCTION PIPELINE</h3><div class="bar"><i id="progress"></i></div><div class="note" id="note">Start a scan to build the volumetric preview.</div></div><div class="buttons"><button class="btn primary" id="scan">START SCAN</button><button class="btn" id="vr" disabled>VIEW IN VR</button><button class="btn" id="reset">RESET</button></div></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}</script><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';let s,c,r,o,f,run=false,n=18420;s=new THREE.Scene();s.background=new THREE.Color(0x02050a);c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,100);c.position.set(0,1,6);s.add(new THREE.HemisphereLight(0x9defff,0x020307,1.5));let g=new THREE.BufferGeometry(),N=15000,p=new Float32Array(N*3);for(let i=0;i<N;i++){let a=Math.random()*6.283,d=Math.pow(Math.random(),.55)*2.7;p[i*3]=Math.cos(a)*d;p[i*3+1]=(Math.random()-.5)*2.2;p[i*3+2]=Math.sin(a)*d}g.setAttribute('position',new THREE.BufferAttribute(p,3));f=new THREE.Points(g,new THREE.PointsMaterial({color:0x61f6ff,size:.028,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));s.add(f);r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.xr.enabled=true;root.appendChild(r.domElement);o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.autoRotate=true;o.autoRotateSpeed=.4;engine.textContent='WEBGL GPU';async function xr(){if(!navigator.xr){return xrEl('XR NOT AVAILABLE')}try{let ok=await navigator.xr.isSessionSupported('immersive-vr');xrEl(ok?'● IMMERSIVE VR READY':'VR DEVICE NOT DETECTED');vr.disabled=!ok;if(ok)vr.onclick=async()=>{let x=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});r.xr.setSession(x)}}catch(e){xrEl('XR UNAVAILABLE')}}function xrEl(x){xr.textContent=x}xr();function loop(){requestAnimationFrame(loop);f.rotation.y+=.0015;o.update();r.render(s,c)}loop();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});async function scan(){if(run)return;run=true;scanBtn();for(let i=0;i<=100;i+=2){n+=Math.floor(Math.random()*350+80);vox.textContent=n.toLocaleString();conf.textContent=Math.min(96,58+i*.36+Math.random()*3).toFixed(0)+'%';progress.style.width=i+'%';recon.textContent=i<40?'DEPTH':i<78?'FUSING':'SURFACE';state.textContent='MULTI-FRAME FUSION';note.textContent=i<40?'Estimating depth from RGB motion and luminance.':i<78?'Accumulating a sparse volumetric field.':'Preparing holographic surface preview.';await new Promise(q=>setTimeout(q,35))}run=false;scan.textContent='SCAN COMPLETE';state.textContent='HOLOGRAM READY';note.textContent='Preview reconstructed. Export and NFT studio are next.'}function scanBtn(){scan.textContent='CAPTURING…'}scan.onclick=scan;reset.onclick=()=>{run=false;n=18420;vox.textContent=n.toLocaleString();conf.textContent='--%';progress.style.width='0%';recon.textContent='READY';state.textContent='SPATIAL CAPTURE ENGINE';note.textContent='Start a scan to build the volumetric preview.';scan.textContent='START SCAN'};</script></body></html>
