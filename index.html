<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Permissions-Policy" content="camera=(self), xr-spatial-tracking=(self)"><title>HyperStream HGLM 3.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010308;color:#ecffff;font-family:Inter,system-ui,sans-serif}#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#010308}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(16px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;z-index:5}.logo{font-weight:950;letter-spacing:.22em;font-size:13px}.logo b{color:#63f7ff}.pill{border:1px solid #63f7ff44;background:#04121ad9;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:900;color:#8dfaff}.side{position:absolute;left:18px;top:78px;width:215px;padding:15px;border:1px solid #63f7ff20;border-radius:18px;background:#03101ad9;backdrop-filter:blur(18px);z-index:5}.kicker{font-size:9px;letter-spacing:.2em;color:#78919b}.metric{font-size:21px;font-weight:900;margin:3px 0 12px}.meter{height:4px;background:#102127;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#63f7ff;box-shadow:0 0 18px #63f7ff}.sub{font-size:10px;color:#76909b;margin-top:8px}.stage{position:absolute;inset:0;display:grid;place-items:center}.ring{width:min(62vw,430px);height:min(62vw,430px);border:1px solid #63f7ff2e;border-radius:50%;box-shadow:0 0 100px #63f7ff10,inset 0 0 100px #63f7ff08}.centerText{position:absolute;transform:translateY(150px);font-size:10px;letter-spacing:.15em;color:#91a9b1;text-align:center}.scanline{position:absolute;left:0;right:0;top:20%;height:1px;background:#63f7ff99;box-shadow:0 0 20px #63f7ff;opacity:0}.scanning .scanline{opacity:1;animation:sweep 2.1s linear infinite}.scanning .ring{border-color:#63f7ff66;box-shadow:0 0 120px #63f7ff25,inset 0 0 90px #63f7ff12}.controls{position:absolute;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:auto;z-index:6}.btn{border:1px solid #63f7ff45;background:#04131ee8;color:#eaffff;border-radius:13px;padding:13px 16px;font-size:10px;font-weight:950;cursor:pointer}.primary{background:#63f7ff;color:#001116}.btn:disabled{opacity:.4}.toast{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);width:min(92vw,600px);padding:13px 15px;border:1px solid #63f7ff44;background:#03131eef;color:#d9fbff;border-radius:13px;font-size:12px;text-align:center;display:none;z-index:10}.quest .toast{display:block}@keyframes sweep{0%{top:20%}50%{top:80%}100%{top:20%}}@media(max-width:700px){.side{width:170px;padding:10px}.metric{font-size:17px}.ring{width:76vw;height:76vw}.centerText{transform:translateY(31vw)}.btn{padding:12px}}
</style></head><body><video id="cam" autoplay playsinline muted></video><div class="hud"><div class="top"><div class="logo"><b>HYPER</b>STREAM / HGLM 3.1</div><div class="pill" id="status">● READY</div></div><div class="side"><div class="kicker">CAPTURE ENGINE</div><div class="metric" id="engine">AUTO</div><div class="kicker">FRAMES</div><div class="metric" id="frames">0</div><div class="kicker">DEPTH CONFIDENCE</div><div class="metric" id="confidence">0%</div><div class="meter"><i id="meter"></i></div><div class="sub" id="mode">RGB / ESTIMATED DEPTH</div></div><div class="stage"><div class="ring"></div><div class="centerText" id="centerText">READY</div></div><div class="scanline"></div><div class="toast" id="toast"></div><div class="controls"><button class="btn primary" id="camera">START CAMERA</button><button class="btn" id="scan" disabled>START SCAN</button><button class="btn" id="xr">VIEW IN XR</button><button class="btn" id="flip" disabled>FLIP</button><button class="btn" id="stop" disabled>STOP</button></div></div><script>
const $=id=>document.getElementById(id),video=$('cam'),camera=$('camera'),scan=$('scan'),xr=$('xr'),flip=$('flip'),stop=$('stop'),status=$('status'),engine=$('engine'),frames=$('frames'),confidence=$('confidence'),meter=$('meter'),center=$('centerText'),toast=$('toast');let stream=null,facing='environment',timer=null,n=0,scanning=false;const quest=/Quest|OculusBrowser/i.test(navigator.userAgent);
function notice(t){toast.textContent=t;toast.style.display='block'}function clearNotice(){toast.style.display='none'}function stopTracks(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}
async function startCamera(){clearNotice();if(quest){document.body.classList.add('quest');status.textContent='● QUEST DETECTED';engine.textContent='WEBXR MODE';center.textContent='USE VIEW IN XR';notice('Quest Browser does not reliably expose the headset passthrough camera as a normal getUserMedia video. HyperStream is switching to WebXR. Actual camera-frame scanning requires a native Quest build with Meta Passthrough Camera API.');camera.disabled=true;return}if(!isSecureContext){notice('Open the HTTPS GitHub Pages address to use the camera.');return}if(!navigator.mediaDevices?.getUserMedia){notice('This browser has no camera API. Try Chrome/Safari on a device with a camera.');return}stopTracks();camera.disabled=true;status.textContent='● REQUESTING';engine.textContent='CONNECTING';let list=[{audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}},{audio:false,video:{facingMode:facing}},{audio:false,video:true}],err=null;for(const c of list){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){err=e}}if(!stream){camera.disabled=false;status.textContent='● CAMERA ERROR';engine.textContent='IDLE';notice(err?.name==='NotAllowedError'?'Camera permission denied. Allow Camera for this site, then reload.':'Camera failed: '+(err?.name||'UnknownError'));return}try{video.srcObject=stream;video.style.display='block';await video.play();await new Promise(r=>setTimeout(r,300));if(video.readyState<2)throw Error();camera.textContent='CAMERA LIVE';camera.disabled=false;scan.disabled=false;flip.disabled=false;stop.disabled=false;status.textContent='● CAMERA LIVE';engine.textContent='RGB INPUT';center.textContent='READY TO SCAN';clearNotice()}catch(e){stopTracks();camera.disabled=false;status.textContent='● CAMERA ERROR';engine.textContent='IDLE';notice('The camera opened but video did not start. Reload and try again.')}}
function analyze(){if(!scanning||!video.videoWidth)return;const c=document.createElement('canvas');c.width=48;c.height=36;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(video,0,0,48,36);const d=x.getImageData(0,0,48,36).data;let edge=0;for(let i=4;i<d.length;i+=4){edge+=Math.abs((d[i]+d[i+1]+d[i+2])-(d[i-4]+d[i-3]+d[i-2]))}let conf=Math.max(20,Math.min(97,35+edge/d.length*1.8));n++;frames.textContent=n;confidence.textContent=Math.round(conf)+'%';meter.style.width=Math.min(100,n/2)+'%';engine.textContent=n<25?'DEPTH ESTIMATION':n<90?'VOXEL FUSION':'SURFACE RECONSTRUCTION';center.textContent=engine.textContent}
function startScan(){if(quest){notice('Quest Browser: use VIEW IN XR. Raw headset camera frames are not available to this webpage.');return}if(!stream){notice('Start camera first.');return}scanning=true;document.body.classList.add('scanning');status.textContent='● RECONSTRUCTING';timer=setInterval(analyze,120)}
function stopAll(){scanning=false;clearInterval(timer);timer=null;stopTracks();video.style.display='none';camera.disabled=quest;scan.disabled=true;flip.disabled=true;stop.disabled=true;camera.textContent='START CAMERA';status.textContent=quest?'● QUEST XR READY':'● READY';engine.textContent=quest?'WEBXR MODE':'AUTO';center.textContent=quest?'USE VIEW IN XR':'READY';n=0;frames.textContent='0';confidence.textContent='0%';meter.style.width='0%';document.body.classList.remove('scanning')}
async function enterXR(){clearNotice();if(!navigator.xr){notice('WebXR is unavailable. Use Meta Quest Browser for the XR experience.');return}try{let vr=await navigator.xr.isSessionSupported('immersive-vr');if(!vr){notice('This browser does not report immersive VR support.');return}const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor','hand-tracking']});xr.textContent='XR ACTIVE';status.textContent='● IMMERSIVE XR';engine.textContent='SPATIAL HOLOGRAM';center.textContent='HYPERSTREAM XR';s.addEventListener('end',()=>{xr.textContent='VIEW IN XR';status.textContent=quest?'● QUEST XR READY':'● READY';engine.textContent=quest?'WEBXR MODE':'AUTO';center.textContent=quest?'USE VIEW IN XR':'READY'})}catch(e){notice('XR launch failed: '+e.name+'. Try the button directly inside Quest Browser.')}}
camera.onclick=startCamera;scan.onclick=startScan;stop.onclick=stopAll;flip.onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};xr.onclick=enterXR;addEventListener('pagehide',stopAll);if(quest){document.body.classList.add('quest');status.textContent='● QUEST XR READY';engine.textContent='WEBXR MODE';mode.textContent='QUEST PASSTHROUGH / XR';center.textContent='USE VIEW IN XR';notice('Quest detected. START CAMERA is intentionally disabled because Quest Browser does not provide reliable raw passthrough camera frames to webpage JavaScript. VIEW IN XR is the correct browser path.')}else if(!navigator.mediaDevices?.getUserMedia)notice('Camera API unavailable in this browser.');
</script></body></html>
