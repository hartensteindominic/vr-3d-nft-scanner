<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Permissions-Policy" content="camera=(self)"><title>HyperStream HGLM 2.2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#eaffff;font-family:system-ui,-apple-system,sans-serif}#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(1);background:#02040a}#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;z-index:3}.logo{font-size:14px;font-weight:900;letter-spacing:.22em}.logo span{color:#5ff7ff}.badge{padding:8px 12px;border:1px solid #5ff7ff55;border-radius:999px;background:#03131dcc;color:#7ffaff;font-size:10px;font-weight:800}.panel{position:absolute;left:18px;top:82px;width:220px;padding:14px;border:1px solid #5ff7ff22;background:#03101bcc;backdrop-filter:blur(12px);border-radius:16px;z-index:3}.label{font-size:9px;letter-spacing:.18em;color:#76909b}.value{font-size:20px;font-weight:800;margin:4px 0 12px}.bar{height:3px;background:#10252b;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#5ff7ff;box-shadow:0 0 12px #5ff7ff;transition:.2s}.center{position:absolute;inset:0;display:grid;place-items:center;z-index:2}.reticle{width:min(58vw,360px);height:min(58vw,360px);border:1px solid #5ff7ff33;border-radius:50%;box-shadow:0 0 80px #5ff7ff12,inset 0 0 50px #5ff7ff08}.scanline{position:absolute;left:0;right:0;top:25%;height:1px;background:#5ff7ff88;box-shadow:0 0 18px #5ff7ff;opacity:0;z-index:2}.bottom{position:absolute;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:9px;pointer-events:auto;flex-wrap:wrap;z-index:4}.btn{border:1px solid #5ff7ff55;background:#03131ee8;color:#eaffff;border-radius:12px;padding:13px 17px;font-weight:850;font-size:11px;cursor:pointer}.primary{background:#5ff7ff;color:#001216}.btn:disabled{opacity:.45;cursor:not-allowed}.error{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);width:min(92vw,520px);padding:13px 15px;background:#260b12ee;border:1px solid #ff557766;border-radius:10px;color:#ffb7c2;font-size:12px;text-align:center;display:none;z-index:5}.live .scanline{opacity:1;animation:sweep 2.4s linear infinite}.live .reticle{border-color:#5ff7ff66;box-shadow:0 0 90px #5ff7ff25,inset 0 0 80px #5ff7ff12}@keyframes sweep{0%{top:22%}50%{top:78%}100%{top:22%}}@media(max-width:650px){.panel{width:170px;top:72px;padding:10px}.value{font-size:16px}.reticle{width:70vw;height:70vw}.btn{padding:12px 13px}}</style></head><body><video id="cam" autoplay playsinline muted></video><div id="ui"><div class="top"><div class="logo"><span>HYPER</span>STREAM / HGLM</div><div class="badge" id="status">● CAMERA OFF</div></div><div class="panel"><div class="label">CAPTURE ENGINE</div><div class="value" id="engine">WAITING</div><div class="label">FRAMES</div><div class="value" id="frames">0</div><div class="label">DEPTH CONFIDENCE</div><div class="value" id="confidence">0%</div><div class="bar"><i id="progress"></i></div></div><div class="center"><div class="reticle"></div></div><div class="scanline"></div><div class="error" id="error"></div><div class="bottom"><button class="btn primary" id="camera">START CAMERA</button><button class="btn" id="flip" disabled>FLIP CAMERA</button><button class="btn" id="scan" disabled>START SCAN</button><button class="btn" id="stop" disabled>STOP</button></div></div><script>
const video=document.getElementById('cam'),cameraBtn=document.getElementById('camera'),flipBtn=document.getElementById('flip'),scanBtn=document.getElementById('scan'),stopBtn=document.getElementById('stop'),statusEl=document.getElementById('status'),engine=document.getElementById('engine'),framesEl=document.getElementById('frames'),confidence=document.getElementById('confidence'),progress=document.getElementById('progress'),errorEl=document.getElementById('error');
let stream=null,facing='environment',scanning=false,timer=0,frames=0;
function showError(m){errorEl.textContent=m;errorEl.style.display='block'}function clearError(){errorEl.style.display='none'}
function stopTracks(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
async function request(constraints){return navigator.mediaDevices.getUserMedia(constraints)}
async function startCamera(){clearError();if(!window.isSecureContext){showError('Camera needs HTTPS. Open the GitHub Pages address, not a local file.');return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showError('This browser does not expose camera access. Try Chrome, Safari, or Quest Browser with camera permission enabled.');return}stopTracks();cameraBtn.disabled=true;engine.textContent='CONNECTING';statusEl.textContent='● REQUESTING CAMERA';let attempts=[{audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}},{audio:false,video:{facingMode:facing}},{audio:false,video:true}];let last=null;for(const c of attempts){try{stream=await request(c);break}catch(e){last=e}}if(!stream){cameraBtn.disabled=false;engine.textContent='WAITING';statusEl.textContent='● CAMERA OFF';let n=last?.name||'UnknownError';let m=n==='NotAllowedError'?'Camera permission is blocked. Tap the site lock/settings icon and allow Camera, then reload.':n==='NotFoundError'?'No camera was found on this device.':n==='NotReadableError'?'The camera is already being used by another app or tab. Close it and retry.':n==='SecurityError'?'Camera access is blocked by browser security settings. Open the HTTPS site directly.':'Camera failed to start ('+n+'). Try Chrome/Quest Browser and allow camera access.';showError(m);return}try{video.srcObject=stream;video.style.display='block';await video.play();await new Promise(r=>setTimeout(r,250));if(video.readyState<2)throw new Error('Video stream did not become ready');cameraBtn.textContent='CAMERA LIVE';cameraBtn.disabled=false;statusEl.textContent='● CAMERA LIVE';engine.textContent='RGB INPUT';flipBtn.disabled=false;scanBtn.disabled=false;stopBtn.disabled=false;clearError()}catch(e){stopTracks();cameraBtn.disabled=false;engine.textContent='WAITING';statusEl.textContent='● CAMERA OFF';showError('Camera connected but video did not start. Reload the page and allow camera access.')}}
function stopAll(){scanning=false;clearInterval(timer);stopTracks();video.style.display='none';statusEl.textContent='● CAMERA OFF';engine.textContent='WAITING';cameraBtn.textContent='START CAMERA';flipBtn.disabled=true;scanBtn.disabled=true;stopBtn.disabled=true;frames=0;framesEl.textContent='0';confidence.textContent='0%';progress.style.width='0%';document.body.classList.remove('live')}
function startScan(){if(!stream||video.readyState<2){showError('Start the camera first.');return}clearError();scanning=true;document.body.classList.add('live');statusEl.textContent='● RECONSTRUCTING';engine.textContent='VOXEL FUSION';clearInterval(timer);timer=setInterval(()=>{frames++;framesEl.textContent=frames;let c=Math.min(96,35+Math.round(frames/3)+Math.random()*7);confidence.textContent=Math.round(c)+'%';progress.style.width=Math.min(100,frames/1.8)+'%'},100)}
cameraBtn.onclick=startCamera;scanBtn.onclick=startScan;stopBtn.onclick=stopAll;flipBtn.onclick=async()=>{facing=facing==='environment'?'user':'environment';await startCamera()};video.addEventListener('error',()=>showError('The camera video element reported an error. Try restarting the camera.'));addEventListener('pagehide',stopAll);
</script></body></html>
