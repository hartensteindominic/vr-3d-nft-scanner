<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070611"><title>HyperStream ✦</title><script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script><style>:root{--c:#8fffff;--v:#c7a8ff;--p:#ffb8e9;--g:#a4ffd6;--ink:#f9fbff;--mut:#9691ae}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070611;color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}body{overflow-x:hidden;background:radial-gradient(circle at 50% -5%,#3b2860 0,#17142e 25%,#080714 65%,#030309 100%)}body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:conic-gradient(from 20deg at 50% 50%,#8fffff08,#c7a8ff12,#ffb8e90c,#8fffff08);filter:blur(55px);animation:aurora 12s linear infinite}@keyframes aurora{to{transform:rotate(360deg)}}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff9 1px,transparent 1.5px),radial-gradient(circle,#8fffff88 1px,transparent 1.5px);background-size:83px 97px,137px 151px;background-position:20px 30px,80px 90px;opacity:.25;animation:drift 25s linear infinite}@keyframes drift{to{background-position:110px 140px,20px 0}}main{position:relative;width:min(1180px,94vw);margin:auto;padding:20px 0 70px}.nav{display:flex;align-items:center;justify-content:space-between}.logo{font-size:11px;letter-spacing:6px;font-weight:950}.logo b{color:var(--c);text-shadow:0 0 20px var(--c)}.live{font-size:9px;letter-spacing:2px;color:#a8a4ba}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g);margin-right:6px}.hero{text-align:center;padding:58px 0 26px}.hero .ey{font-size:9px;letter-spacing:5px;color:var(--v);font-weight:900}.hero h1{font-size:clamp(58px,11vw,130px);line-height:.78;letter-spacing:-9px;margin:16px 0 22px;font-weight:950}.grad{background:linear-gradient(100deg,#fff,var(--c) 35%,var(--v) 65%,var(--p));color:transparent;background-clip:text;-webkit-background-clip:text}.hero p{margin:auto;max-width:550px;color:#aaa5bd;font-size:14px;line-height:1.55}.orbit{position:relative;margin:28px auto 0;width:min(790px,100%);height:540px;border-radius:48% 52% 45% 55%/48% 43% 57% 52%;background:radial-gradient(circle at 50% 48%,#ffffff0a 0 13%,transparent 14%),radial-gradient(circle at 50% 50%,#8fffff0c,transparent 46%);border:1px solid #ffffff0b;box-shadow:inset 0 0 90px #c7a8ff08,0 40px 120px #0008;overflow:hidden}.orb{position:absolute;left:50%;top:49%;width:220px;height:220px;transform:translate(-50%,-50%);border-radius:42% 58% 55% 45%;background:radial-gradient(circle at 32% 25%,#fff,#a9ffff 13%,#9c88ff 42%,#432e72 70%,#151028);box-shadow:0 0 35px #8fffff55,0 0 100px #c7a8ff33,inset -25px -30px 50px #05040d;animation:float 5s ease-in-out infinite;cursor:grab}.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid #8fffff66;inset:-35px;transform:rotate(28deg);box-shadow:0 0 20px #8fffff18}.orb:after{inset:-65px;border-color:#ffb8e944;transform:rotate(-30deg)}@keyframes float{50%{transform:translate(-50%,-56%) rotate(5deg);border-radius:55% 45% 48% 52%}}.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 18px var(--c);animation:twinkle 2.7s infinite ease-in-out}.s1{left:18%;top:27%}.s2{right:18%;top:32%;animation-delay:.7s;background:var(--p);box-shadow:0 0 18px var(--p)}.s3{left:25%;bottom:24%;animation-delay:1.2s;background:var(--v)}.s4{right:24%;bottom:20%;animation-delay:1.8s;background:var(--g)}@keyframes twinkle{50%{transform:scale(.3);opacity:.25}}.ring{position:absolute;left:50%;top:49%;width:470px;height:170px;border:1px solid #8fffff35;border-radius:50%;transform:translate(-50%,-50%) rotate(-17deg);animation:spin 15s linear infinite}.ring.r2{width:560px;height:210px;border-color:#ffb8e92c;transform:translate(-50%,-50%) rotate(32deg);animation-direction:reverse;animation-duration:19s}@keyframes spin{to{transform:translate(-50%,-50%) rotate(343deg)}}.dock{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:999px;background:#0b0916c9;border:1px solid #ffffff16;box-shadow:0 15px 50px #0009;backdrop-filter:blur(22px);white-space:nowrap}.mode{border:0;border-radius:999px;background:transparent;color:#8e899f;padding:12px 17px;font-weight:900;font-size:10px;letter-spacing:1px;cursor:pointer;transition:.25s}.mode:hover,.mode.active{color:#071016;background:linear-gradient(135deg,var(--c),#b6d5ff);box-shadow:0 7px 25px #8fffff25}.mode span{font-size:14px;margin-right:4px}.panel{margin:-2px auto 0;width:min(560px,92vw);position:relative;z-index:3;padding:20px;border-radius:30px;background:#0b0917d9;border:1px solid #ffffff13;box-shadow:0 30px 100px #000b,inset 0 0 45px #c7a8ff08;backdrop-filter:blur(28px)}.drop{border:1px dashed #c7a8ff66;border-radius:22px;padding:22px;text-align:center;cursor:pointer;background:#ffffff04;transition:.25s}.drop:hover{border-color:#8fffff;transform:translateY(-2px);background:#8fffff08}.drop strong{display:block;font-size:16px}.drop small{color:#716d83;font-size:9px}.drop input{display:none}.name{margin-top:10px;width:100%;border:1px solid #ffffff12;background:#05040c;color:#fff;border-radius:14px;padding:13px;outline:none}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:0;border-radius:15px;padding:14px;font-weight:950;cursor:pointer;background:linear-gradient(135deg,var(--c),#b6b9ff);color:#050611}.btn.alt{background:#ffffff08;color:#eafaff;border:1px solid #ffffff13}.wallet{margin-top:10px;text-align:center}.addr{font:9px monospace;color:var(--g);margin-top:7px;min-height:13px}.status{text-align:center;font:9px monospace;color:var(--g);min-height:20px;margin-top:7px}.status.err{color:#ff9cab}.result{display:none;margin:16px auto 0;width:min(560px,92vw);padding:18px;border-radius:24px;background:#0b0917e8;border:1px solid #a4ffd633;text-align:center}.result.show{display:block}.tx{font:9px monospace;color:var(--c);word-break:break-all;margin:8px}.result .btn{display:inline-block;text-decoration:none}.tiny{font-size:8px;letter-spacing:3px;color:#77728b}@media(max-width:600px){main{width:94vw}.hero{padding-top:45px}.hero h1{font-size:59px;letter-spacing:-5px}.orbit{height:470px}.orb{width:160px;height:160px}.ring{width:350px;height:130px}.ring.r2{width:410px;height:155px}.dock{bottom:18px;max-width:92%;overflow:auto}.mode{padding:11px 12px}.panel{margin-top:-1px}.buttons{grid-template-columns:1fr}.live{display:none}}</style></head><body><div class="stars"></div><main><div class="nav"><div class="logo"><b>✦</b> HYPERSTREAM</div><div class="live"><i></i>LIVE · SEPOLIA</div></div><section class="hero"><div class="ey">SPATIAL CREATION STUDIO</div><h1>Make it <span class="grad">yours.</span></h1><p>Capture a moment. Give it a world. Mint it.</p></section><section class="orbit"><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div><div class="ring"></div><div class="ring r2"></div><div class="orb" id="orb"></div><div class="dock"><button class="mode active" id="photo">◌ PHOTO</button><button class="mode" id="video">▶ VIDEO</button><button class="mode" id="scan">◎ SCAN</button></div></section><section class="panel"><label class="drop" id="drop"><strong id="dropTitle">＋ choose a photo</strong><small id="dropSmall">JPG · PNG · WEBP</small><input id="file" type="file" accept="image/*"></label><input class="name" id="name" value="My HyperWorld" maxlength="80"><div class="buttons"><button class="btn alt" id="save">SAVE ✦</button><button class="btn" id="mint">MINT ✦</button></div><div class="wallet"><button class="btn alt" id="connect">🦊 CONNECT</button><div class="addr" id="addr"></div><div class="status" id="status"></div></div></section><section class="result" id="result"><div class="tiny">✦ ON-CHAIN</div><h3>Your world is minted.</h3><div class="tx" id="tx"></div><a class="btn" id="view" target="_blank" rel="noopener">VIEW ✦</a></section></main><script>const API='https://vr-3d-nft-scanner.vercel.app',CONTRACT='0x6ebd920e2383e11a06440ed632c51225b5f1909b',ABI=['function mint(address to,string metadataURI) external returns(uint256)'];let file=null,uploaded=null,mode='image';const $=id=>document.getElementById(id),say=(x,e=0)=>{$('status').textContent=x;$('status').className='status'+(e?' err':'')};function setMode(m){mode=m;[photo,video,scan].forEach(x=>x.classList.remove('active'));(m==='image'?photo:m==='video'?video:scan).classList.add('active');file.value='';file.accept=m==='image'?'image/*':m==='video'?'video/*':'image/*,video/*';dropTitle.textContent=m==='image'?'＋ choose a photo':m==='video'?'＋ choose a video':'＋ choose scan media';dropSmall.textContent=m==='image'?'JPG · PNG · WEBP':m==='video'?'MP4 · WEBM · MOV':'multiple views · photo or video';say('')};photo.onclick=()=>setMode('image');video.onclick=()=>setMode('video');scan.onclick=()=>setMode('scan');drop.onclick=()=>file.click();file.onchange=e=>{if(e.target.files[0]){window.file=e.target.files[0];file=e.target.files[0];dropTitle.textContent='✦ '+file.name;say('Ready ✦')}};save.onclick=async()=>{if(!file)return say('Choose something first.',1);try{say('Saving…');let fd=new FormData;fd.append('file',file);fd.append('name',$('name').value);let r=await fetch(API+'/api/upload',{method:'POST',body:fd});if(!r.ok)throw Error('Upload failed');uploaded=await r.json();say('Saved to IPFS ✦')}catch(e){say(e.message,1)}};connect.onclick=async()=>{try{if(window.ethereum){let a=await ethereum.request({method:'eth_requestAccounts'});$('addr').textContent=a[0].slice(0,7)+'…'+a[0].slice(-5);say('Connected ✦');return}if(window.hyperstreamWallet?.connect){let a=await window.hyperstreamWallet.connect();$('addr').textContent=a||'Connected';return}throw Error('Open MetaMask')}catch(e){say(e.message,1)}};mint.onclick=async()=>{try{if(!uploaded){await save.onclick();if(!uploaded)return}if(!window.ethereum)throw Error('Open MetaMask');let a=await ethereum.request({method:'eth_requestAccounts'}),p=new ethers.BrowserProvider(ethereum),s=await p.getSigner(),c=new ethers.Contract(CONTRACT,ABI,s);say('Confirm in MetaMask…');let tx=await c.mint(a[0],uploaded.metadataURI||uploaded.uri);await tx.wait();$('result').classList.add('show');$('tx').textContent=tx.hash;$('view').href='https://sepolia.etherscan.io/tx/'+tx.hash;say('Minted ✦')}catch(e){say(e.shortMessage||e.message||'Mint failed',1)}};orb.onpointermove=e=>{let r=orb.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;orb.style.transform=`translate(calc(-50% + ${x*18}px),calc(-50% + ${y*18}px)) rotate(${x*8}deg)`};orb.onpointerleave=()=>orb.style.transform='translate(-50%,-50%)';</script></body></html>
