<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070611"><title>HyperStream · Make it yours.</title><script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script><script src="./reown-wallet.js?v=20260818-26"></script><style>:root{--c:#8fffff;--v:#bda7ff;--p:#ffb9e8;--g:#9dffd0}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#49316d,#14132d 32%,#070611 72%,#020207);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 30%,#8fffff16,transparent 25%),radial-gradient(circle at 85% 55%,#ffb9e812,transparent 28%);filter:blur(5px)}.stars{position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px),radial-gradient(circle,#8fffff 1px,transparent 1.5px);background-size:91px 103px,137px 149px;animation:drift 30s linear infinite}@keyframes drift{to{background-position:100px 140px,-30px 20px}}main{width:min(1100px,94vw);margin:auto;padding:22px 0 70px;position:relative}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:11px;font-weight:950;letter-spacing:5px}.logo b{color:var(--c);text-shadow:0 0 18px var(--c)}.live{font-size:9px;letter-spacing:2px;color:#a9a5bb}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g)}.hero{text-align:center;padding:55px 0 22px}.ey{font-size:9px;letter-spacing:5px;color:var(--v);font-weight:900}.hero h1{font-size:clamp(60px,11vw,125px);line-height:.78;letter-spacing:-9px;margin:15px 0 20px;font-weight:950}.grad{background:linear-gradient(100deg,#fff,var(--c),var(--v),var(--p));background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{color:#aaa6bd;font-size:14px;margin:auto;max-width:520px;line-height:1.6}.world{position:relative;width:min(760px,100%);height:490px;margin:20px auto 0;border-radius:48%;background:radial-gradient(circle at center,#8fffff0b,transparent 52%);overflow:hidden}.orb{position:absolute;left:50%;top:45%;width:205px;height:205px;transform:translate(-50%,-50%);border-radius:46% 54% 58% 42%;background:radial-gradient(circle at 28% 22%,#fff,#a8ffff 12%,#9c85ff 45%,#4b3274 72%,#130d27);box-shadow:0 0 35px #8fffff55,0 0 110px #bda7ff30,inset -28px -30px 55px #05030b;animation:float 5s ease-in-out infinite;transition:.25s;overflow:hidden}.orb img,.orb video{width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:.94}.orb:after{content:"";position:absolute;inset:-42px;border:1px solid #8fffff55;border-radius:50%;transform:rotate(24deg)}@keyframes float{50%{transform:translate(-50%,-55%) rotate(5deg);border-radius:56% 44% 47% 53%}}.ring{position:absolute;left:50%;top:45%;width:470px;height:165px;border:1px solid #8fffff33;border-radius:50%;transform:translate(-50%,-50%) rotate(-18deg);animation:spin 15s linear infinite}.ring.r2{width:560px;height:210px;border-color:#ffb9e833;transform:translate(-50%,-50%) rotate(30deg);animation-direction:reverse;animation-duration:20s}@keyframes spin{to{transform:translate(-50%,-50%) rotate(342deg)}}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 18px currentColor;animation:pulse 2.5s infinite}.s1{left:18%;top:25%}.s2{right:19%;top:31%;color:var(--p);background:var(--p);animation-delay:.6s}.s3{left:24%;bottom:23%;color:var(--v);background:var(--v);animation-delay:1.1s}.s4{right:25%;bottom:20%;color:var(--g);background:var(--g);animation-delay:1.7s}@keyframes pulse{50%{transform:scale(.25);opacity:.2}}.dock{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:8px;border-radius:999px;background:#080713d9;border:1px solid #fff2;backdrop-filter:blur(24px);box-shadow:0 18px 60px #000a}.mode{border:0;border-radius:999px;background:transparent;color:#8e8a9f;padding:12px 18px;font-size:10px;font-weight:950;cursor:pointer}.mode.active{color:#071016;background:linear-gradient(135deg,var(--c),#b8c6ff);box-shadow:0 7px 25px #8fffff2b}.panel{position:relative;z-index:4;width:min(560px,94vw);margin:-5px auto 0;padding:20px;border-radius:28px;background:#0b0917df;border:1px solid #fff2;box-shadow:0 30px 100px #000b,inset 0 0 50px #bda7ff08;backdrop-filter:blur(25px)}.drop{display:block;text-align:center;border:1px dashed #bda7ff66;border-radius:20px;padding:22px;cursor:pointer;background:#fff1;transition:.2s}.drop:hover{border-color:var(--c);background:#8fffff09}.drop strong{display:block;font-size:17px}.drop small{color:#77738b;font-size:9px}.drop input{display:none}.name{width:100%;margin-top:10px;padding:13px 14px;border-radius:13px;border:1px solid #fff2;background:#05040b;color:#fff;outline:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:0;border-radius:14px;padding:14px;font-weight:950;cursor:pointer;background:linear-gradient(135deg,var(--c),#b8b8ff);color:#050611}.btn.alt{background:#fff1;border:1px solid #fff2;color:#eefcff}.btn:disabled{opacity:.5}.meter{height:4px;margin-top:10px;background:#151322;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--v),var(--p));transition:.2s}.wallet{margin-top:10px;text-align:center}.addr{font:10px monospace;color:var(--g);min-height:15px;margin-top:7px}.status{font:10px monospace;color:var(--g);white-space:pre-wrap;min-height:28px;margin-top:8px}.error{color:#ff9cab}.cid{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#050a0d;border:1px solid #9dffd033;color:#9dffd0;font:9px monospace;word-break:break-all}.cid.show{display:block}.result{display:none;width:min(560px,94vw);margin:15px auto;padding:20px;border-radius:25px;background:#0b0917ed;border:1px solid #9dffd033;text-align:center}.result.show{display:block}.tx{font:9px monospace;color:var(--c);word-break:break-all;margin:10px}.share{display:inline-block;text-decoration:none}@media(max-width:600px){main{width:94vw}.hero h1{font-size:58px;letter-spacing:-5px}.world{height:430px}.orb{width:155px;height:155px}.ring{width:350px;height:125px}.ring.r2{width:420px;height:150px}.dock{max-width:94%;overflow:auto}.mode{padding:11px 13px}.row{grid-template-columns:1fr}}</style></head><body><div class="stars"></div><main><div class="top"><div class="logo"><b>✦</b> HYPERSTREAM</div><div class="live"><i></i> READY · SEPOLIA</div></div><section class="hero"><div class="ey">SPATIAL CREATION STUDIO</div><h1>Make it <span class="grad">yours.</span></h1><p>Take a photo or video. Get a CID. Mint it.</p></section><section class="world"><div class="ring"></div><div class="ring r2"></div><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div><div class="orb" id="orb"></div><div class="dock"><button class="mode active" id="photo">◌ PHOTO</button><button class="mode" id="video">▶ VIDEO</button></div></section><section class="panel"><label class="drop" id="drop"><strong id="dropTitle">＋ Take a photo</strong><small id="dropSmall">Camera · JPG · PNG · WEBP</small><input id="file" type="file" accept="image/*" capture="environment"></label><input class="name" id="name" value="My HyperWorld" maxlength="80"><div class="meter"><i id="meter"></i></div><div class="row"><button class="btn alt" id="save">SAVE · GET CID</button><button class="btn" id="mint">MINT ✦</button></div><div class="wallet"><button class="btn alt" id="connect">🦊 CONNECT WALLET</button><div class="addr" id="addr"></div></div><div class="cid" id="cid"></div><div class="status" id="status"></div></section><section class="result" id="result"><div style="color:var(--g);letter-spacing:3px;font-size:9px">✦ ON-CHAIN</div><h2>Make it yours. ✓</h2><div class="tx" id="tx"></div><a class="btn share" id="view" target="_blank" rel="noopener">VIEW TRANSACTION</a></section></main><script>const API='https://vr-3d-nft-scanner.vercel.app',CONTRACT='0x6ebd920e2383e11a06440ed632c51225b5f1909b',ABI=['function mint(address to,string metadataURI) external returns(uint256)'];let mode='image',file=null,uploaded=null;const $=id=>document.getElementById(id);function say(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' error':'')}function setMode(m){mode=m;photo.classList.toggle('active',m==='image');video.classList.toggle('active',m==='video');file=null;uploaded=null;$('file').value='';$('file').accept=m==='image'?'image/*':'video/*';$('file').setAttribute('capture','environment');$('dropTitle').textContent=m==='image'?'＋ Take a photo':'＋ Record a video';$('dropSmall').textContent=m==='image'?'Camera · JPG · PNG · WEBP':'Camera · MP4 · WEBM · MOV';say('')}photo.onclick=()=>setMode('image');video.onclick=()=>setMode('video');drop.onclick=e=>{if(e.target!==file)file.click()};file.onchange=e=>pick(e.target.files[0]);function pick(f){if(!f)return;if(f.size>250*1024*1024)return say('File is over 250 MB.',true);if(mode==='image'&&!f.type.startsWith('image/'))return say('Choose a photo.',true);if(mode==='video'&&!f.type.startsWith('video/'))return say('Choose a video.',true);file=f;uploaded=null;$('dropTitle').textContent='✓ '+f.name;$('meter').style.width='20%';$('orb').innerHTML='';const u=URL.createObjectURL(f);if(mode==='image'){const im=new Image();im.src=u;im.onload=()=>{$('orb').appendChild(im)}}else{const v=document.createElement('video');v.src=u;v.muted=true;v.autoplay=true;v.loop=true;v.playsInline=true;$('orb').appendChild(v)}say('Ready ✦')}async function sign(){const r=await fetch(API+'/api/sign-media?filename='+encodeURIComponent(file.name)+'&type='+encodeURIComponent(file.type));const d=await r.json();if(!r.ok||!d.url)throw Error(d.error||'Media signing failed');return d.url}function send(url){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest;x.open('POST',url);x.timeout=1800000;x.upload.onprogress=e=>{if(e.lengthComputable){$('meter').style.width=(20+e.loaded/e.total*65)+'%';say('Uploading · '+(e.loaded/e.total*100).toFixed(0)+'%')}};x.onload=()=>{let d={};try{d=JSON.parse(x.responseText||'{}')}catch{}const cid=d?.data?.cid||d?.cid;if(x.status<200||x.status>=300||!cid)return reject(Error(d.error||'IPFS upload failed'));resolve(cid)};x.onerror=()=>reject(Error('Network error'));x.ontimeout=()=>reject(Error('Upload timed out'));const fd=new FormData;fd.append('network','public');fd.append('file',file,file.name);x.send(fd)})}async function upload(){if(!file)return say('Take a photo or video first.',true),null;if(uploaded)return uploaded;say('Saving to IPFS…');const cid=await send(await sign()),uri='ipfs://'+cid;const metadata={name:$('name').value.trim()||'HyperStream Object',description:'HyperStream digital collectible',animation_url:uri,attributes:[{trait_type:'Media',value:mode==='image'?'Photo':'Video'},{trait_type:'Network',value:'Ethereum Sepolia'}]};if(mode==='image')metadata.image=uri;const r=await fetch(API+'/api/metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({metadata})});const d=await r.json();if(!r.ok||!d.metadataUri)throw Error(d.error||'Metadata upload failed');uploaded={cid,uri,metadataUri:d.metadataUri};$('cid').textContent='CID · '+cid+'\n'+d.metadataUri;$('cid').classList.add('show');$('meter').style.width='100%';window.hyperstreamLastMetadataUri=d.metadataUri;window.hyperstreamLastName=$('name').value;return uploaded}save.onclick=async()=>{if(save.disabled)return;save.disabled=true;try{await upload();say('CID READY · IPFS ✓')}catch(e){say('SAVE FAILED · '+e.message,true)}finally{save.disabled=false}};connect.onclick=()=>window.reownConnect?window.reownConnect():say('Wallet core not loaded.',true);mint.onclick=async()=>{if(mint.disabled)return;mint.disabled=true;try{const u=await upload();if(!u)throw Error('Upload required');const p=window.walletProvider;if(!p)throw Error('Connect your wallet first.');const provider=new ethers.BrowserProvider(p);const net=await provider.getNetwork();if(net.chainId!==11155111n)throw Error('Switch to Sepolia.');const signer=await provider.getSigner(),addr=await signer.getAddress(),c=new ethers.Contract(CONTRACT,ABI,signer);say('Confirm mint in MetaMask…');const tx=await c.mint(addr,u.metadataUri);say('Transaction sent…\n'+tx.hash);const receipt=await tx.wait();if(receipt.status!==1)throw Error('Transaction failed.');$('result').classList.add('show');$('tx').textContent=tx.hash;$('view').href='https://sepolia.etherscan.io/tx/'+tx.hash;say('NFT MINTED ✓ · ON-CHAIN');$('result').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){say('MINT FAILED · '+(e.shortMessage||e.reason||e.message),true)}finally{mint.disabled=false}};</script></body></html>
