<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HyperStream X ✦ Make it yours.</title><style>:root{--a:#8fffff;--b:#c7a8ff;--p:#ffb8e9;--g:#a4ffd6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#33215a,#0b0918 45%,#030309);color:#fff;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:-30%;background:conic-gradient(#8fffff0d,#ffb8e90b,#c7a8ff12,#8fffff0d);filter:blur(70px);animation:spin 18s linear infinite;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}main{width:min(1180px,94vw);margin:auto;padding:22px 0 60px;position:relative}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:11px;letter-spacing:5px;font-weight:950}.logo i{color:var(--a)}.net{font-size:9px;letter-spacing:2px;color:#aaa5bd}.net b{color:var(--g)}.hero{text-align:center;padding:52px 0 22px}.ey{font-size:9px;letter-spacing:5px;color:var(--b);font-weight:900}.hero h1{font-size:clamp(54px,10vw,112px);letter-spacing:-7px;line-height:.82;margin:15px 0 20px}.hero h1 span{background:linear-gradient(100deg,#fff,var(--a),var(--b),var(--p));background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{color:#a9a3bb;font-size:14px}.stage{position:relative;height:470px;border:1px solid #ffffff0b;border-radius:48% 52% 45% 55%/48% 43% 57% 52%;overflow:hidden;background:radial-gradient(circle,#8fffff0a,transparent 48%);box-shadow:inset 0 0 90px #c7a8ff08,0 30px 100px #0009}.core{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:44% 56% 53% 47%;background:radial-gradient(circle at 30% 25%,#fff,#a9ffff 12%,#9b86ff 42%,#3b2966 72%,#100c20);box-shadow:0 0 45px #8fffff55,0 0 120px #c7a8ff25;animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translate(-50%,-57%) rotate(6deg);border-radius:55% 45% 48% 52%}}.orbit{position:absolute;left:50%;top:43%;width:480px;height:170px;border:1px solid #8fffff33;border-radius:50%;transform:translate(-50%,-50%) rotate(-18deg);animation:orb 14s linear infinite}.orbit.two{width:560px;height:210px;border-color:#ffb8e92c;transform:translate(-50%,-50%) rotate(30deg);animation-duration:18s;animation-direction:reverse}@keyframes orb{to{transform:translate(-50%,-50%) rotate(342deg)}}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a)}.s1{left:18%;top:22%}.s2{right:18%;top:30%;background:var(--p);box-shadow:0 0 18px var(--p)}.s3{left:24%;bottom:22%;background:var(--b)}.dock{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:8px;border:1px solid #ffffff13;border-radius:999px;background:#090714d9;backdrop-filter:blur(24px);white-space:nowrap}.dock button,.btn{border:0;border-radius:999px;padding:12px 17px;background:#ffffff08;color:#b4aec4;font-weight:900;font-size:10px;cursor:pointer}.dock button.active,.btn.primary{background:linear-gradient(135deg,var(--a),#b9c3ff);color:#050611;box-shadow:0 8px 28px #8fffff24}.panel{position:relative;margin:-5px auto 0;width:min(620px,92vw);padding:20px;border-radius:28px;background:#090714e8;border:1px solid #ffffff12;box-shadow:0 30px 100px #000b;backdrop-filter:blur(28px)}.drop{display:block;padding:20px;text-align:center;border:1px dashed #c7a8ff55;border-radius:20px;cursor:pointer}.drop:hover{border-color:var(--a);background:#8fffff06}.drop strong{display:block}.drop small{color:#777187;font-size:9px}.drop input{display:none}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.field{width:100%;border:1px solid #ffffff10;border-radius:13px;background:#04030a;color:#fff;padding:12px;outline:none}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:9px}.actions .btn{flex:1}.meta{margin-top:12px;padding:12px;border-radius:16px;background:#ffffff05;color:#8f8a9f;font:9px monospace;word-break:break-all;display:none}.meta.show{display:block}.status{text-align:center;min-height:18px;margin-top:8px;font:9px monospace;color:var(--g)}.status.err{color:#ff9cab}.result{display:none;text-align:center;margin:14px auto;width:min(620px,92vw);padding:18px;border-radius:22px;background:#090714ee;border:1px solid #a4ffd633}.result.show{display:block}.result a{display:inline-block;text-decoration:none;margin-top:8px}.tiny{font-size:8px;letter-spacing:3px;color:#777187}@media(max-width:600px){.hero h1{letter-spacing:-4px}.stage{height:420px}.core{width:145px;height:145px}.orbit{width:340px;height:125px}.orbit.two{width:400px;height:150px}.dock{max-width:92%;overflow:auto}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.actions{flex-direction:column}}</style></head><body><main><div class="nav"><div class="logo"><i>✦</i> HYPERSTREAM</div><div class="net">● <b>SEPOLIA</b></div></div><section class="hero"><div class="ey">SPATIAL CREATION STUDIO</div><h1>Make it <span>yours.</span></h1><p>Capture something real. Turn it into something yours.</p></section><section class="stage"><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="orbit"></div><div class="orbit two"></div><div class="core" id="core"></div><div class="dock"><button class="active" data-mode="photo">◌ PHOTO</button><button data-mode="video">▶ VIDEO</button><button data-mode="gallery">▣ GALLERY</button></div></section><section class="panel"><label class="drop"><strong id="pick">＋ Take or choose media</strong><small>Photo · Video · Multiple files</small><input id="file" type="file" accept="image/*,video/*" capture="environment" multiple></label><div class="fields"><input id="name" class="field" placeholder="NFT name" value="My HyperWorld"><input id="creator" class="field" placeholder="Creator"><textarea id="desc" class="field wide" rows="2" placeholder="Describe your creation"></textarea></div><div class="actions"><button class="btn" id="upload">☁ SAVE TO IPFS</button><button class="btn primary" id="connect">🦊 CONNECT</button><button class="btn primary" id="mint">MINT ✦</button></div><div class="meta" id="meta"></div><div class="status" id="status"></div></section><section class="result" id="result"><div class="tiny">✦ ON-CHAIN</div><h3>Your creation is minted.</h3><div id="tx"></div><a id="view" class="btn primary" target="_blank" rel="noopener">VIEW TRANSACTION ✦</a></section></main><script>const $=x=>document.getElementById(x),file=$('file');let media=[],uploaded=null;function status(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' err':'')}document.querySelectorAll('.dock button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.dock button').forEach(x=>x.classList.remove('active'));b.classList.add('active');file.accept=b.dataset.mode==='video'?'video/*':'image/*,video/*';file.click()});file.onchange=()=>{media=[...file.files];$('pick').textContent=media.length?`✦ ${media.length} file${media.length>1?'s':''} ready`:'＋ Take or choose media';status(media.length?'Ready to upload ✦':'')};$('core').onpointermove=e=>{let r=$('core').getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;$('core').style.transform=`translate(calc(-50% + ${x*20}px),calc(-50% + ${y*20}px)) rotate(${x*10}deg)`};$('core').onpointerleave=()=>$('core').style.transform='translate(-50%,-50%)';$('upload').onclick=async()=>{if(!media.length)return status('Choose a photo or video first.',true);try{status('Uploading to IPFS…');let fd=new FormData;media.forEach(f=>fd.append('file',f));fd.append('name',$('name').value);fd.append('description',$('desc').value);fd.append('creator',$('creator').value);let r=await fetch('/api/upload',{method:'POST',body:fd});if(!r.ok)throw Error('IPFS upload failed');uploaded=await r.json();$('meta').classList.add('show');$('meta').textContent='CID: '+(uploaded.cid||uploaded.metadataCID||uploaded.metadataURI||uploaded.uri||'created');status('IPFS ✓ Ready to mint')}catch(e){status(e.message,true)}};$('connect').onclick=async()=>{try{if(!window.ethereum)throw Error('Open MetaMask in this browser');let a=await ethereum.request({method:'eth_requestAccounts'});$('connect').textContent='🦊 '+a[0].slice(0,6)+'…'+a[0].slice(-4);status('Wallet connected ✦')}catch(e){status(e.message,true)}};$('mint').onclick=async()=>{if(!uploaded){status('Upload media first, then mint.',true);return}status('Preparing mint…');try{let r=await fetch('/api/mint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,description:$('desc').value,creator:$('creator').value,uri:uploaded.metadataURI||uploaded.uri||uploaded.cid,cid:uploaded.cid})});if(!r.ok)throw Error('Mint endpoint failed');let d=await r.json(),h=d.txHash||d.hash;if(h){$('result').classList.add('show');$('tx').textContent=h;$('view').href='https://sepolia.etherscan.io/tx/'+h;status('Minted on-chain ✦')}else status('Mint request sent ✦')}catch(e){status(e.message,true)}};</script></body></html>
