<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream · Make it yours.</title><script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script><script src="./reown-wallet.js?v=20260818-28"></script><style>:root{--c:#8fffff;--v:#bda7ff;--p:#ffb9e8;--g:#9dffd0}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -10%,#4a3270,#14132d 35%,#070611 75%,#020207);overflow-x:hidden}body:before{content:"";position:fixed;inset:-30%;pointer-events:none;background:conic-gradient(from 0deg,#8fffff08,#ffb9e812,#bda7ff12,#8fffff08);filter:blur(70px);animation:a 18s linear infinite}@keyframes a{to{transform:rotate(360deg)}}.stars{position:fixed;inset:0;opacity:.28;pointer-events:none;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px),radial-gradient(circle,#8fffff 1px,transparent 1.5px);background-size:91px 103px,137px 149px;animation:s 28s linear infinite}@keyframes s{to{background-position:100px 130px,-30px 30px}}main{width:min(1120px,94vw);margin:auto;padding:22px 0 70px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:950;letter-spacing:5px;font-size:11px}.logo b{color:var(--c);text-shadow:0 0 20px var(--c)}.live{font-size:9px;letter-spacing:2px;color:#aaa6bd}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 15px var(--g)}.hero{text-align:center;padding:48px 0 12px}.ey{font-size:9px;letter-spacing:5px;color:var(--v);font-weight:900}.hero h1{font-size:clamp(58px,11vw,125px);line-height:.78;letter-spacing:-9px;margin:16px 0 20px;font-weight:950}.grad{background:linear-gradient(100deg,#fff,var(--c),var(--v),var(--p));color:transparent;background-clip:text;-webkit-background-clip:text}.hero p{color:#aaa6bd;font-size:14px}.world{position:relative;width:min(780px,100%);height:500px;margin:10px auto 0;overflow:hidden;border-radius:48%;background:radial-gradient(circle,#8fffff0b,transparent 58%)}.orb{position:absolute;left:50%;top:44%;width:220px;height:220px;transform:translate(-50%,-50%);border-radius:46% 54% 58% 42%;background:radial-gradient(circle at 28% 22%,#fff,#a8ffff 12%,#9c85ff 45%,#4b3274 72%,#130d27);box-shadow:0 0 35px #8fffff55,0 0 120px #bda7ff35;animation:f 5s ease-in-out infinite;overflow:hidden}.orb img,.orb video{width:100%;height:100%;object-fit:cover}.orb:after{content:"";position:absolute;inset:-38px;border:1px solid #8fffff55;border-radius:50%;transform:rotate(25deg)}@keyframes f{50%{transform:translate(-50%,-56%) rotate(5deg);border-radius:55% 45% 47% 53%}}.ring{position:absolute;left:50%;top:44%;width:500px;height:170px;border:1px solid #8fffff38;border-radius:50%;transform:translate(-50%,-50%) rotate(-18deg);animation:r 15s linear infinite}.ring2{width:600px;height:215px;border-color:#ffb9e82c;transform:translate(-50%,-50%) rotate(30deg);animation-direction:reverse;animation-duration:20s}@keyframes r{to{transform:translate(-50%,-50%) rotate(342deg)}}.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 18px currentColor;animation:p 2.5s infinite}.x1{left:18%;top:23%}.x2{right:18%;top:30%;color:var(--p);background:var(--p);animation-delay:.6s}.x3{left:24%;bottom:22%;color:var(--v);background:var(--v);animation-delay:1.1s}.x4{right:25%;bottom:19%;color:var(--g);background:var(--g);animation-delay:1.7s}@keyframes p{50%{transform:scale(.2);opacity:.2}}.dock{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:999px;background:#080713df;border:1px solid #fff2;backdrop-filter:blur(25px)}.mode{border:0;border-radius:999px;background:transparent;color:#8f8a9f;padding:12px 18px;font-weight:950;font-size:10px;cursor:pointer}.mode.active{color:#071016;background:linear-gradient(135deg,var(--c),#b8c6ff)}.panel{position:relative;z-index:4;width:min(590px,94vw);margin:-2px auto 0;padding:20px;border-radius:28px;background:#0b0917e8;border:1px solid #fff2;box-shadow:0 30px 100px #000b,inset 0 0 50px #bda7ff08;backdrop-filter:blur(25px)}.drop{display:block;text-align:center;border:1px dashed #bda7ff66;border-radius:20px;padding:21px;cursor:pointer;background:#fff1}.drop strong{display:block;font-size:17px}.drop small{color:#77738b;font-size:9px}.drop input{display:none}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.field{width:100%;padding:12px 13px;border-radius:13px;border:1px solid #fff2;background:#05040b;color:#fff;outline:0}.wide{grid-column:1/-1}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:0;border-radius:14px;padding:14px;font-weight:950;cursor:pointer;background:linear-gradient(135deg,var(--c),#b8b8ff);color:#050611}.btn.alt{background:#fff1;border:1px solid #fff2;color:#eefcff}.btn:disabled{opacity:.45}.meter{height:4px;margin-top:10px;background:#151322;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--v),var(--p));transition:.2s}.wallet{text-align:center;margin-top:10px}.addr{font:10px monospace;color:var(--g);min-height:15px;margin-top:7px}.cid{display:none;margin-top:10px;padding:12px;border-radius:14px;background:#050a0d;border:1px solid #9dffd033;color:var(--g);font:9px monospace;word-break:break-all}.cid.show{display:block}.status{text-align:center;font:10px monospace;color:var(--g);white-space:pre-wrap;min-height:26px;margin-top:8px}.err{color:#ff9cab}.result{display:none;width:min(590px,94vw);margin:15px auto;padding:20px;border-radius:25px;background:#0b0917ed;border:1px solid #9dffd033;text-align:center}.result.show{display:block}.tx{font:9px monospace;color:var(--c);word-break:break-all;margin:10px}.share{display:inline-block;text-decoration:none}@media(max-width:600px){.hero h1{font-size:59px;letter-spacing:-5px}.world{height:430px}.orb{width:160px;height:160px}.ring{width:350px;height:125px}.ring2{width:430px;height:155px}.fields,.row{grid-template-columns:1fr}.wide{grid-column:auto}.dock{max-width:94%;overflow:auto}.mode{padding:11px 13px}}</style></head><body><div class="stars"></div><main><div class="top"><div class="logo"><b>✦</b> HYPERSTREAM</div><div class="live"><i></i> READY · SEPOLIA</div></div><section class="hero"><div class="ey">SPATIAL CREATION STUDIO</div><h1>Make it <span class="grad">yours.</span></h1><p>Capture · CID · Mint</p></section><section class="world"><div class="ring"></div><div class="ring ring2"></div><div class="spark x1"></div><div class="spark x2"></div><div class="spark x3"></div><div class="spark x4"></div><div class="orb" id="orb"></div><div class="dock"><button class="mode active" id="photo">◌ PHOTO</button><button class="mode" id="video">▶ VIDEO</button></div></section><section class="panel"><label class="drop" id="drop"><strong id="dropTitle">＋ Take a photo</strong><small id="dropSmall">Camera · JPG · PNG · WEBP</small><input id="file" type="file" accept="image/*" capture="environment"></label><div class="fields"><input class="field" id="name" placeholder="NFT name" value="My HyperWorld" maxlength="80"><input class="field" id="creator" placeholder="Creator" maxlength="60"><textarea class="field wide" id="desc" placeholder="Description" rows="2" maxlength="500"></textarea></div><div class="meter"><i id="meter"></i></div><div class="row"><button class="btn alt" id="save">SAVE · GET CID</button><button class="btn" id="mint">MINT ✦</button></div><div class="wallet"><button class="btn alt" id="connect">🦊 CONNECT WALLET</button><div class="addr" id="addr"></div></div><div class="cid" id="cid"></div><div class="status" id="status"></div></section><section class="result" id="result"><div style="color:var(--g);letter-spacing:3px;font-size:9px">✦ ON-CHAIN</div><h2>Make it yours. ✓</h2><div class="tx" id="tx"></div><button class="btn" id="copy">COPY TX</button> <a class="btn share" id="view" target="_blank" rel="noopener">VIEW ✦</a></section></main><script>const API='https://vr-3d-nft-scanner.vercel.app',CONTRACT='0x6ebd920e2383e11a06440ed632c51225b5f1909b',ABI=['function mint(address to,string metadataURI) external returns(uint256)'];let mode='image',media=null,state=null;const $=id=>document.getElementById(id);function status(t,e=false){$('status').textContent=t;$('status').className='status'+(e?' err':'')}function setMode(m){mode=m;photo.classList.toggle('active',m==='image');video.classList.toggle('active',m==='video');media=null;file.value='';file.accept=m==='image'?'image/*':'video/*';file.setAttribute('capture','environment');dropTitle.textContent=m==='image'?'＋ Take a photo':'＋ Record a video';dropSmall.textContent=m==='image'?'Camera · JPG · PNG · WEBP':'Camera · MP4 · WEBM · MOV';$('meter').style.width='0';status('')}photo.onclick=()=>setMode('image');video.onclick=()=>setMode('video');drop.onclick=e=>{if(e.target!==file)file.click()};file.onchange=e=>pick(e.target.files[0]);function pick(f){if(!f)return;if(f.size>250*1024*1024)return status('File is over 250 MB.',true);if(mode==='image'&&!f.type.startsWith('image/'))return status('Choose a photo.',true);if(mode==='video'&&!f.type.startsWith('video/'))return status('Choose a video.',true);media=f;$('dropTitle').textContent='✓ '+f.name;$('meter').style.width='15%';const u=URL.createObjectURL(f);orb.innerHTML='';if(mode==='image'){const im=new Image();im.src=u;im.onload=()=>orb.appendChild(im)}else{const v=document.createElement('video');v.src=u;v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;orb.appendChild(v)}status('Ready ✦')}async function signed(){const r=await fetch(API+'/api/sign-media?filename='+encodeURIComponent(media.name)+'&type='+encodeURIComponent(media.type));const d=await r.json();if(!r.ok||!d.url)throw Error(d.error||'Sign failed');return d.url}function uploadTo(url){return new Promise((res,rej)=>{const x=new XMLHttpRequest;x.open('POST',url);x.timeout=1800000;x.upload.onprogress=e=>{if(e.lengthComputable){$('meter').style.width=(15+e.loaded/e.total*65)+'%';status('Uploading · '+Math.round(e.loaded/e.total*100)+'%')}};x.onload=()=>{let d={};try{d=JSON.parse(x.responseText||'{}')}catch{}const cid=d?.data?.cid||d?.cid;if(x.status<200||x.status>=300||!cid)return rej(Error(d.error||'IPFS upload failed'));res(cid)};x.onerror=()=>rej(Error('Network error'));x.ontimeout=()=>rej(Error('Upload timed out'));const fd=new FormData;fd.append('network','public');fd.append('file',media,media.name);x.send(fd)})}async function saveMedia(){if(!media)return status('Take a photo or video first.',true);if(state)return state;status('Saving to IPFS…');const cid=await uploadTo(await signed()),uri='ipfs://'+cid;const metadata={name:$('name').value.trim()||'HyperStream Object',description:$('desc').value.trim()||'HyperStream digital collectible',creator:$('creator').value.trim()||'HyperStream',animation_url:uri,image:mode==='image'?uri:undefined,attributes:[{trait_type:'Media',value:mode==='image'?'Photo':'Video'},{trait_type:'Network',value:'Ethereum Sepolia'}]};const mr=await fetch(API+'/api/metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({metadata})});const md=await mr.json();if(!mr.ok||!md.metadataUri)throw Error(md.error||'Metadata upload failed');state={cid,uri,metadataUri:md.metadataUri};window.hyperstreamLastMetadataUri=md.metadataUri;window.hyperstreamLastName=metadata.name;$('cid').textContent='MEDIA CID · '+cid+'\nMETADATA · '+md.metadataUri;$('cid').classList.add('show');$('meter').style.width='100%';status('CID READY ✓');return state}save.onclick=async()=>{save.disabled=true;try{await saveMedia()}catch(e){status('SAVE FAILED · '+e.message,true)}finally{save.disabled=false}};connect.onclick=()=>{if(window.reownConnect)window.reownConnect();else status('Wallet core unavailable.',true)};mint.onclick=async()=>{mint.disabled=true;try{const u=await saveMedia();if(!window.walletProvider)throw Error('Connect your wallet first.');const p=window.walletProvider;const provider=new ethers.BrowserProvider(p),net=await provider.getNetwork();if(net.chainId!==11155111n)throw Error('Switch to Sepolia.');const signer=await provider.getSigner(),addr=await signer.getAddress(),contract=new ethers.Contract(CONTRACT,ABI,signer);status('Confirm mint in MetaMask…');const tx=await contract.mint(addr,u.metadataUri);status('Transaction sent…');const receipt=await tx.wait();if(receipt.status!==1)throw Error('Transaction failed');$('result').classList.add('show');$('tx').textContent=tx.hash;$('view').href='https://sepolia.etherscan.io/tx/'+tx.hash;$('copy').onclick=()=>navigator.clipboard?.writeText(tx.hash);status('NFT MINTED ✓ · ON-CHAIN');$('result').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){status('MINT FAILED · '+(e.shortMessage||e.reason||e.message),true)}finally{mint.disabled=false}};</script></body></html>
