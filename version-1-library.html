<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HyperStream // 3D Library</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:white;font-family:system-ui}#app{position:fixed;inset:0}.ui{position:fixed;inset:0;pointer-events:none}.bar{pointer-events:auto;display:flex;justify-content:space-between;padding:18px 22px}.brand{font-weight:1000;letter-spacing:3px}.brand b{color:#64f4ff}.btn{border:1px solid #ffffff22;background:#080b15dd;color:#fff;border-radius:14px;padding:11px 15px;font-weight:900}.hero{position:absolute;left:4vw;top:18vh;max-width:430px}.ey{color:#64f4ff;font-size:10px;letter-spacing:4px;font-weight:900}.hero h1{font-size:clamp(55px,8vw,105px);line-height:.82;letter-spacing:-6px;margin:12px 0}.hero p{color:#929bb0;line-height:1.6}.library{position:absolute;right:25px;bottom:25px;width:340px;background:#050812dd;border:1px solid #ffffff18;border-radius:24px;padding:18px;backdrop-filter:blur(22px);pointer-events:auto}.library h2{margin:4px 0}.items{display:flex;gap:8px;overflow:auto}.item{min-width:92px;height:112px;border:1px solid #ffffff15;border-radius:15px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#25214a,#080a11);cursor:pointer}.orb{width:45px;height:45px;border-radius:40%;background:var(--c);box-shadow:0 0 35px var(--c);transform:rotate(35deg)}.buy{width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;background:white;font-weight:1000}@media(max-width:650px){.hero{left:20px;top:14vh}.hero h1{font-size:58px}.library{left:16px;right:16px;bottom:16px;width:auto}.bar .btn{display:none}}</style></head><body><div id="app"></div><div class="ui"><div class="bar"><div class="brand"><b>◆</b> HYPERSTREAM</div><button class="btn">CONNECT WALLET</button></div><section class="hero"><div class="ey">THE 3D LIBRARY</div><h1>OWN<br>OBJECTS<br>IN SPACE.</h1><p>Not a wall of cards. A living library of collectible 3D objects. Orbit the archive, choose an artifact, inspect it and make it yours.</p></section><aside class="library"><div class="ey">COLLECTION / 01</div><h2 id="name">NEON RELIC</h2><div id="price">0.42 ETH</div><div class="items" id="items"></div><button class="buy">BUY SELECTED OBJECT</button></aside></div><script type="module">import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const s=new THREE.Scene();s.fog=new THREE.FogExp2(0x02040a,.022);const c=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);c.position.set(0,4,18);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#app').appendChild(r.domElement);const o=new OrbitControls(c,r.domElement);o.enableDamping=1;o.enablePan=0;o.maxDistance=32;s.add(new THREE.AmbientLight(0x7788ff,1.5));let colors=[0x64f4ff,0x9c72ff,0xff61d8,0x70ffb4,0xffc45b,0x7e9dff];let names=['NEON RELIC','VOID BLOOM','CHROMA CORE','STAR FORGE','AETHER MASK','DREAM ENGINE'];let objs=[];for(let i=0;i<18;i++){let g=new THREE.Group(),co=colors[i%6],m=new THREE.MeshStandardMaterial({color:co,emissive:co,emissiveIntensity:.5,metalness:.7,roughness:.2}),q=i%3==0?new THREE.TorusKnotGeometry(1,.25,64,12):i%3==1?new THREE.IcosahedronGeometry(1.15,2):new THREE.OctahedronGeometry(1.3,2);g.add(new THREE.Mesh(q,m));let ring=new THREE.Mesh(new THREE.TorusGeometry(1.7,.018,8,80),new THREE.MeshBasicMaterial({color:co,transparent:true,opacity:.7}));ring.rotation.x=1.1;g.add(ring);g.position.set((i%6-2.5)*3.5,Math.floor(i/6)*2.8-2,-Math.floor(i/6)*7);g.userData={name:names[i%6],price:(.12+i*.035).toFixed(2)};s.add(g);objs.push(g)}let floor=new THREE.GridHelper(160,80,0x1d3150,0x0b1525);floor.position.y=-4;s.add(floor);let t=0;function loop(){requestAnimationFrame(loop);t+=.006;objs.forEach((g,i)=>{g.rotation.y+=.006;g.position.y+=Math.sin(t*2+i)*.002});o.update();r.render(s,c)}loop();let list=document.querySelector('#items');objs.slice(0,6).forEach((g,i)=>{let x=document.createElement('div');x.className='item';x.innerHTML='<div class="orb" style="--c:#'+colors[i].toString(16).padStart(6,'0')+'"></div>';x.onclick=()=>{document.querySelector('#name').textContent=g.userData.name;document.querySelector('#price').textContent=g.userData.price+' ETH';c.position.set(g.position.x,g.position.y+2,g.position.z+7)};list.appendChild(x)});addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
