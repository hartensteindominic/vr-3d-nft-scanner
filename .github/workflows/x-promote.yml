name: Auto-Post Release to X

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Tweet
        if: ${{ secrets.TWITTER_CONSUMER_API_KEY != '' && secrets.TWITTER_CONSUMER_API_SECRET != '' && secrets.TWITTER_ACCESS_TOKEN != '' && secrets.TWITTER_ACCESS_TOKEN_SECRET != '' }}
        uses: ethomson/send-tweet-action@v1
        with:
          status: |
            🌌 HyperStream just evolved (${{ github.event.release.tag_name }}).

            ${{ github.event.release.body }}

            🥽 Quest · 📱 iPhone · 💻 Desktop
            Create yours → https://hartensteindominic.github.io/vr-3d-nft-scanner/
            Release → ${{ github.event.release.html_url }}
          consumer-key: ${{ secrets.TWITTER_CONSUMER_API_KEY }}
          consumer-secret: ${{ secrets.TWITTER_CONSUMER_API_SECRET }}
          access-token: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          access-token-secret: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

      - name: Report configuration status
        env:
          X_CONFIGURED: ${{ secrets.TWITTER_CONSUMER_API_KEY != '' && secrets.TWITTER_CONSUMER_API_SECRET != '' && secrets.TWITTER_ACCESS_TOKEN != '' && secrets.TWITTER_ACCESS_TOKEN_SECRET != '' }}
        run: |
          if [ "$X_CONFIGURED" = "true" ]; then
            echo "✅ HyperStream release promotion sent to X."
          else
            echo "ℹ️ X secrets are not configured yet. No post was sent because X secrets are missing."
          fi
